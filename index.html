<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STORE MANAGER">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>STORE MANAGER · ZARA</title>
<style>
:root{
  --bg:#f4f4f2;--card:#fff;--ink:#0b0b0c;--ink2:#2b2c2f;--muted:#83858a;--faint:#b3b5b9;
  --line:#e7e7e4;--line2:#efefec;--soft:#f3f3f1;--dark:#0e0f11;--dark2:#1b1c1f;
  --pos:#167a4a;--pos-bg:#e7f3ec;--neg:#b42318;--neg-bg:#fbeceb;--amb:#a5620a;--amb-bg:#fbf1e1;
  --r:18px;--r-sm:12px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.42 var(--sans);font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #6b7280;outline-offset:2px;border-radius:8px}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}.ic.lg{width:22px;height:22px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 14px 18px}
.brand{padding:0 12px}
.brand .wm{font-weight:800;letter-spacing:.2em;font-size:14px;white-space:nowrap}
.brand .sub{font-size:9.5px;letter-spacing:.2em;color:var(--muted);margin-top:5px;font-weight:600}
.sidenav{margin-top:34px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:#5b5d62;font-weight:550;font-size:13.5px;text-align:left;transition:background .15s}
.navbtn:hover{background:var(--soft)}
.navbtn.active{background:var(--dark);color:#fff}
.navbtn .badge{margin-left:auto}
.side .foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line2);font-size:10.5px;color:var(--muted);line-height:1.55}
.side .who{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mainwrap{min-width:0}
.mhead{display:none}
main{padding:26px 34px 60px;max-width:1240px;margin:0 auto}
.tabbar{display:none}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.eyebrow{font-size:9.5px;letter-spacing:.17em;font-weight:700;color:var(--muted);text-transform:uppercase}
.h1{font-size:30px;font-weight:750;letter-spacing:-.035em;margin:4px 0 2px;line-height:1.1}
.lead{color:var(--muted);font-size:12.5px}
.ph .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- atoms ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;background:var(--soft);color:#55575c;font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.pill.dark{background:var(--dark);color:#fff}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.neg{background:var(--neg-bg);color:var(--neg)}.pill.amb{background:var(--amb-bg);color:var(--amb)}
.pill.line{background:transparent;border:1px solid var(--line)}
.pill.demo{background:#fff;border:1px solid var(--ink);color:var(--ink);letter-spacing:.14em;font-weight:800;font-size:9.5px}
.pill.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amb)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amb)}.muted{color:var(--muted)}
.mini{font-size:10.5px;color:var(--muted)}.small{font-size:12px}
.lbl{font-size:9.5px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hstack{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.primary:hover{background:#26282c}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.onDark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
.btn.onDark:hover{background:rgba(255,255,255,.18)}
.btn.white{background:#fff;color:var(--ink);border-color:#fff}
.linkbtn{color:var(--ink);font-weight:600;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.linkbtn.muted{color:var(--muted)}

.seg{display:inline-flex;background:#e9e9e6;border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-weight:600;font-size:12px;color:#606267;white-space:nowrap}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.seg.sm button{height:24px;padding:0 10px;font-size:11px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;position:relative}
.card.flat{box-shadow:none}
.card.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.card.dark .lbl,.card.dark .mini,.card.dark .muted{color:#9a9ca1}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch .seg{flex:none}
.ch h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.ch .t{display:flex;flex-direction:column;gap:2px}
.big{font-size:34px;font-weight:760;letter-spacing:-.045em;line-height:1.05}
.metric{font-size:22px;font-weight:720;letter-spacing:-.035em;line-height:1.1}
.metric.s{font-size:18px}
.grid{display:grid;gap:14px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec h2{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:750}
.divider{height:1px;background:var(--line2);margin:14px 0}
.card.dark .divider{background:rgba(255,255,255,.1)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:11px}
.delta.pos{color:var(--pos)}.delta.neg{color:var(--neg)}
.card.dark .delta.pos{color:#5fd39a}.card.dark .delta.neg{color:#ff8a80}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:12px}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:11.5px;color:#55575c;display:flex;gap:9px;align-items:flex-start}
.notice .ic{margin-top:1px}

/* ---------- AI welcome ---------- */
.welcome{background:var(--dark);color:#fff;border-radius:22px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent);pointer-events:none}
.ai-av{width:34px;height:34px;border-radius:11px;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.welcome h2{font-size:20px;margin:10px 0 4px;letter-spacing:-.03em;font-weight:720}
.welcome p{margin:0;color:#b9bbc0;font-size:12.5px}
.welcome .quick{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.req{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);text-align:left;width:100%;color:#fff;transition:background .15s}
.req:hover{background:rgba(255,255,255,.11)}
.req .ri{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.req b{font-size:12.5px;font-weight:620;display:block}
.req span.mini{color:#9a9ca1}
.reqs{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.askbar{display:flex;gap:8px;margin-top:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:4px 4px 4px 12px;align-items:center}
.askbar input{flex:1;background:transparent;border:0;outline:0;color:#fff;min-width:0;height:30px}
.askbar input::placeholder{color:#8e9095}
.askbar button{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--ink);display:grid;place-items:center}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.kpi .spark{height:30px;width:96px}
.hero .big{font-size:36px;margin:8px 0 2px}
.hero .sub2{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.hero .sub2>div{display:flex;flex-direction:column;gap:1px}

/* ---------- bar chart ---------- */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:200px;align-items:end;position:relative;padding-top:6px}
.bars::before{content:"";position:absolute;inset:6px 0 26px 0;background:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px 25%);pointer-events:none}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;position:relative;cursor:pointer;border-radius:10px;padding:0 2px}
.bcol .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bcol .bar{width:min(42px,72%);border-radius:7px 7px 3px 3px;background:var(--dark);position:relative;transition:height .35s cubic-bezier(.2,.8,.2,1),background .15s}
.bcol .bar.prev{position:absolute;bottom:0;background:transparent;border:1.5px dashed #c9cac7;z-index:0}
.bcol .bar.ghost{background:repeating-linear-gradient(135deg,#ecece9 0 5px,#f6f6f4 5px 10px);border:1px solid #e1e1de}
.bcol .bar.ly{background:#cfd0cc}
.bcol .bar.today{background:#fff;border:1.5px dashed var(--ink)}
.bcol .val{font-size:10.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bcol .dl{font-size:10px;font-weight:700;white-space:nowrap;height:14px}
.bcol .dl.pos{color:var(--pos)}.bcol .dl.neg{color:var(--neg)}
.bcol .dlab{font-size:10.5px;color:var(--muted);font-weight:600;height:20px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.bcol .dlab b{color:var(--ink);font-size:11px}
.bcol.sel{background:var(--soft)}
.bcol.sel .bar:not(.prev):not(.ghost){background:#3a3c41}
.bcol .flag{position:absolute;top:-4px;width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg-box{width:10px;height:10px;border-radius:3px;display:inline-block}

.detail-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 2px 2px;border-top:1px solid var(--line2);margin-top:12px;font-weight:650;font-size:12px}
.detail-toggle .ic{transition:transform .2s}
.detail-toggle.open .ic{transform:rotate(180deg)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr:last-child td{border-bottom:0}
table.t tr.sel td{background:var(--soft)}
table.t tr.click{cursor:pointer}
table.t tr.tot td{font-weight:750;border-top:1px solid var(--line)}

/* ---------- misc viz ---------- */
.hbar{display:grid;grid-template-columns:62px 1fr 52px;align-items:center;gap:10px;margin:9px 0}
.track{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;position:relative}
.fill{height:100%;border-radius:9px;background:var(--dark)}
.stack100{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px}
.stack100>div{height:100%}
.zrow{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.zrow:last-child{border-bottom:0}
.zbars{display:flex;flex-direction:column;gap:3px}
.zbars .track{height:5px}
.zbars .fill.z{background:#bdbeba}
.gapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gapcell{background:var(--soft);border-radius:12px;padding:10px}
.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .12s,box-shadow .15s;min-height:112px}
.qcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.25)}
.qcard .qi{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.qcard b{font-size:13px}
.qcard .mini{margin-top:auto}
.bullet{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.bullet:last-child{border-bottom:0}
.bullet .n{width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:10.5px;font-weight:750;flex:none}
.card.dark .bullet{border-color:rgba(255,255,255,.08)}
.card.dark .bullet .n{background:rgba(255,255,255,.1)}
.alertline{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--amb-bg);color:#6b4307;font-size:12px}
.alertline b{color:#4a2e04}

/* ---------- lists / forms ---------- */
.listrow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.listrow:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:750;font-size:11.5px;letter-spacing:.04em;flex:none;color:var(--ink2)}
.av.dark{background:var(--dark);color:#fff}
.av.xl{width:58px;height:58px;border-radius:18px;font-size:17px}
.person{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;text-align:left;transition:background .12s}
.person:hover{background:var(--soft)}
.person.active{background:var(--dark);color:#fff}
.person.active .mini{color:#a9abb0}
.person.active .av{background:#2a2c30;color:#fff}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.input,.field input,.field select,.field textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:#fff;outline:0;transition:border .15s}
.field textarea{height:auto;min-height:78px;padding:10px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--ink)}
.search{position:relative}
.search input{padding-left:34px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;white-space:nowrap;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:#55575c;background:#fff}
.chip.active{background:var(--dark);border-color:var(--dark);color:#fff}
.check{display:flex;gap:11px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .box{width:20px;height:20px;border-radius:7px;border:1.5px solid #c9cac6;display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s;color:#fff}
.check .box .ic{width:13px;height:13px;stroke-width:2.6;opacity:0}
.check input:checked+.box{background:var(--dark);border-color:var(--dark)}
.check input:checked+.box .ic{opacity:1}
.check input:checked~div b{color:var(--muted);text-decoration:line-through}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.kv .v{font-weight:650;font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.progress{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.progress>div{height:100%;background:var(--dark);border-radius:9px}
.card.dark .progress{background:rgba(255,255,255,.12)}
.card.dark .progress>div{background:#fff}

/* ---------- tasks board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:#ecece9;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col .colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.task{background:#fff;border-radius:12px;padding:11px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.task .tt{display:flex;gap:9px;align-items:flex-start}
.task.done{opacity:.55}
.task.done .ttl{text-decoration:line-through}
.task .ttl{font-weight:620;font-size:12.5px;line-height:1.35}
.task .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid #c9cac6;display:grid;place-items:center;flex:none;color:#fff}
.tick.on{background:var(--dark);border-color:var(--dark)}
.tick .ic{width:12px;height:12px;stroke-width:2.6}

/* ---------- merch ---------- */
.need{display:flex;align-items:center;gap:18px}
.secrow{display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr));gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.secrow:last-child{border-bottom:0}
.secrow.h{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 0 8px}
.secrow>div:not(:first-child){text-align:right}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:38px;overflow:hidden;background:#fff;min-width:0}
.stepper button{width:36px;height:100%;flex:none;font-size:16px;color:var(--ink2)}
.stepper button:hover{background:var(--soft)}
.field .stepper input,.stepper input{flex:1 1 0;width:0;min-width:0;border:0;outline:0;text-align:center;height:100%;padding:0 2px;font-weight:500;font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:-.02em;background:transparent;border-radius:0}
.timeline{position:relative;height:30px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.timeline .tf{position:absolute;top:0;bottom:0;left:0;background:var(--dark);border-radius:9px}
.timeline .tf.over{background:var(--neg)}
.timeline .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amb)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;text-align:center;padding:4px 0 6px}
.cday{min-height:78px;border-radius:11px;background:#fff;border:1px solid var(--line2);padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;transition:border .12s}
.cday:hover{border-color:#cfd0cc}
.cday .dn{font-size:12px;font-weight:700}
.cday.out{background:transparent;border-color:transparent;opacity:.35}
.cday.today .dn{background:var(--dark);color:#fff;border-radius:7px;width:22px;height:22px;display:grid;place-items:center;margin:-2px 0 0 -3px}
.cday.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cday.hp{background:linear-gradient(180deg,#e9f5ee,#fff 70%)}
.cday.hn{background:linear-gradient(180deg,#fcebea,#fff 70%)}
.cday.hol{background:repeating-linear-gradient(135deg,#f6f6f4 0 6px,#fff 6px 12px)}
.cday .tag{font-size:9.5px;line-height:1.2;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;background:var(--soft);color:#55575c}
.cday .tag.p{background:var(--pos-bg);color:var(--pos)}.cday .tag.n{background:var(--neg-bg);color:var(--neg)}.cday .tag.h{background:#e6e6e3;color:#3d3f43}.cday .tag.e{background:var(--dark);color:#fff}
.cday .dots{display:flex;gap:3px;margin-top:auto}
.year{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ym{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:left}
.ym:hover{border-color:#cfd0cc}
.ym h4{margin:0 0 8px;font-size:12px;text-transform:capitalize;font-weight:700;display:flex;justify-content:space-between}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ymg div{font-size:8.5px;text-align:center;height:15px;line-height:15px;border-radius:4px;color:#55575c}
.ymg .p{background:#bfe3cd;color:#0d4f2e;font-weight:700}.ymg .n{background:#f5c4bf;color:#7a1810;font-weight:700}.ymg .h{background:#dcdcd8;font-weight:700}.ymg .t{background:var(--dark);color:#fff;font-weight:700}.ymg .e{box-shadow:inset 0 -2px 0 var(--ink)}
.wkcol{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wkd{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:240px;display:flex;flex-direction:column;gap:6px;text-align:left}
.wkd.today{border-color:var(--ink)}
.wkd .wh{display:flex;align-items:baseline;justify-content:space-between}
.wkd .wh b{font-size:20px;letter-spacing:-.03em}
.ev{font-size:11px;border-radius:8px;padding:6px 8px;background:var(--soft);line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.ev.p{background:var(--pos-bg);color:#0f5534}.ev.n{background:var(--neg-bg);color:#7a1810}.ev.h{background:#e6e6e3}.ev.task{background:#fff;border:1px dashed #cfd0cc}
.ev .x{margin-left:auto;color:var(--muted);font-size:13px;line-height:1}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:520px}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;scroll-behavior:smooth}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.45;white-space:pre-wrap}
.msg.ai{background:var(--soft);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--dark);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msgwrap{display:flex;gap:8px;align-items:flex-end}
.msgwrap.me{justify-content:flex-end}
.composer{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 6px;background:#fff}
.composer input[type=text]{flex:1;border:0;outline:0;height:34px;min-width:0;background:transparent}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--soft)}
.iconbtn.dark{background:var(--dark);color:#fff}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.footer-note{margin:34px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;font-size:12.5px;opacity:0;transition:all .25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* mini barras */
.mbars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:auto}
.mbars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.mbars i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--dark)}
.mbars i.g{background:repeating-linear-gradient(135deg,#ecece9 0 3px,#f6f6f4 3px 6px);border:1px solid #e1e1de}
.mbars span{font-size:9px;color:var(--muted);font-weight:650}
.tk2{display:grid;grid-template-columns:1fr;gap:10px}
.tk2>div{display:flex;flex-direction:column;gap:2px}
.keyd{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.keyd:last-child{border-bottom:0}
.keyd .dd{width:42px;text-align:center;flex:none}
.keyd .dd b{display:block;font-size:17px;letter-spacing:-.03em;line-height:1}
.keyd .dd span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
/* ---------- responsive ---------- */
@media (max-width:1100px){
  .qa{grid-template-columns:repeat(3,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .year{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{display:block}
  .side{display:none}
  body{background:var(--bg)}
  .mhead{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) 10px calc(16px + var(--sal));background:rgba(244,244,242,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid rgba(0,0,0,.08)}
  .mhead .wm{font-weight:800;letter-spacing:.28em;font-size:12.5px}
  .mhead .sub{font-size:8.5px;letter-spacing:.18em;color:var(--muted);font-weight:650;margin-top:2px}
  main{padding:14px calc(14px + var(--sar)) calc(96px + var(--sab)) calc(14px + var(--sal))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.12);padding:6px calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#8d8f94;padding:4px 0;position:relative}
  .tabbar button .ic{width:23px;height:23px;stroke-width:1.6}
  .tabbar button.active{color:var(--ink)}
  .tabbar button.active .ic{stroke-width:2}
  .tabbar .tb-ai .aib{width:42px;height:30px;border-radius:11px;background:var(--dark);color:#fff;display:grid;place-items:center;margin-top:-1px}
  .tabbar .tb-ai .aib .ic{width:19px;height:19px}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:9px;background:var(--neg);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px;font-weight:700}
  .ph{margin:6px 2px 14px;align-items:flex-start}
  .ph .eyebrow{display:none}
  .h1{font-size:28px}
  .ph .right .pill:not(.demo){display:none}
  .g12>*{grid-column:span 12}
  .g12>.m6{grid-column:span 6}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .welcome{grid-template-columns:1fr;gap:12px;padding:16px;border-radius:20px}
  .welcome h2{font-size:18px;margin-top:8px}
  .card{padding:15px;border-radius:16px}
  .big{font-size:30px}.hero .big{font-size:32px}
  .bars{height:178px;gap:4px}
  .bcol .bar{width:78%}
  .bcol .val{font-size:9px}
  .bcol .dl{font-size:9px}
  .qa{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qa .qcard:last-child{grid-column:span 2;min-height:auto;flex-direction:row;align-items:center}
  .qa .qcard:last-child .mini{margin:0 0 0 auto}
  .sec{margin:22px 2px 9px}
  .board{grid-template-columns:1fr}
  .cday{min-height:58px;padding:4px;border-radius:9px}
  .cday .tag{display:none}
  .cday .dots{display:flex}
  .cal{gap:3px}
  .year{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .wkcol{grid-template-columns:1fr}
  .wkd{min-height:auto;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .wkd .wh{width:62px;flex-direction:column;align-items:flex-start}
  .wkd .evs{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .chat{height:calc(100vh - 250px - var(--sab) - var(--sat));min-height:420px}
  .msg{max-width:88%}
  .secrow{grid-template-columns:70px repeat(4,minmax(0,1fr));font-size:12px}
  .hide-m{display:none!important}
  .ph .right .pill.demo{display:none}
  .welcome p{font-size:12px}
  .req{padding:8px 9px}
  .req span.mini{display:none}
  .req b{font-size:12px}
  .req .ri{width:26px;height:26px}
  .hscroll{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 calc(-14px - var(--sar)) 0 calc(-14px - var(--sal));padding:0 14px 4px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll>*{flex:0 0 86%;scroll-snap-align:center}
  .qa{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .qa .qcard,.qa .qcard:last-child{grid-column:auto;min-height:0;padding:10px 4px;align-items:center;flex-direction:column;gap:6px;border-radius:14px;text-align:center}
  .qa .qcard .mini{display:none}
  .qa .qcard b{font-size:10.5px;font-weight:650}
  .qa .qcard .qi{width:36px;height:36px}
  .sm-gauge{flex-direction:row!important;gap:12px!important}
  .sm-gauge svg{max-width:150px!important}
  .g3.keep{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gapcell{padding:9px}
  .gapcell .metric.s{font-size:15px}
  .ai-page .ph{display:none}
  .mbars{height:38px}
  .seg button{padding:0 10px}
  .seg.wk{display:flex;width:100%}.seg.wk button{flex:1;padding:0 6px}
  .smg svg{max-width:180px!important}
  .gapcell .lbl{letter-spacing:.06em;font-size:9px}
  .stepper button{width:28px}
  .mneed .grow{min-width:0!important}
  .hscroll.kp>*{flex:0 0 44%}
  .secrow.h{font-size:8.5px;letter-spacing:.06em}
  .footer-note{justify-content:center;text-align:center}
}
@media (min-width:901px){.show-m{display:none!important}}

/* =================== v5 · CORPORATIVO =================== */
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#000;--ink2:#1c1c1c;--muted:#8b8780;--faint:#b9b5ad;
  --line:#e4e1db;--line2:#eeebe6;--soft:#f3f1ed;--greige:#d8d2c7;--greige2:#ebe7e0;--dark:#000;--dark2:#141414;
  --pos:#2e6a4c;--pos-bg:#eaf1ec;--neg:#9e2f2a;--neg-bg:#f6ebe9;--amb:#8a6a33;--amb-bg:#f4efe5;
  --r:6px;--r-sm:4px;
  --serif:"Didot","Bodoni 72","Bodoni Moda","Bodoni MT","GFS Didot","Playfair Display",Georgia,serif;
  --sans:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
body{font-size:13px;letter-spacing:.005em}
::selection{background:#000;color:#fff}
.zwm{display:block;fill:currentColor;height:auto}
/* gate */
.lock{position:fixed;inset:0;z-index:9999;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--sans);animation:fade .5s var(--ease)}
.lockf{width:min(320px,84vw);text-align:center;display:flex;flex-direction:column;align-items:center}
.lock-wm{width:min(220px,62vw);fill:#fff;margin-bottom:26px}
.lock-t{font-size:11px;letter-spacing:.42em;font-weight:500;padding-left:.42em}
.lock-s{font-size:9px;letter-spacing:.32em;color:#8f8f8f;margin:9px 0 54px;padding-left:.32em}
.lock-l{align-self:flex-start;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8f8f8f;margin-bottom:6px}
#lockp{width:100%;height:46px;border:0;border-bottom:1px solid #4a4a4a;background:transparent;color:#fff;padding:0 2px;font-size:16px;outline:none;border-radius:0;transition:border-color .2s}
#lockp:focus{border-bottom-color:#fff}
#lockp::placeholder{color:#5c5c5c}
.lock-b{margin-top:26px;width:100%;height:48px;border:1px solid #fff;background:#fff;color:#000;font-weight:600;font-size:11px;letter-spacing:.32em;border-radius:0;transition:background .2s,color .2s}
.lock-b:hover{background:#000;color:#fff}
.lock-e{height:18px;margin-top:14px;font-size:11px;color:#e09a94;letter-spacing:.04em}
.lock-f{font-size:8.5px;color:#6f6f6f;margin-top:22px;letter-spacing:.26em}
.lock-v{position:absolute;bottom:calc(22px + var(--sab));left:0;right:0;text-align:center;font-size:8.5px;letter-spacing:.3em;color:#4d4d4d}

/* shell */
.app{grid-template-columns:248px minmax(0,1fr)}
.side{background:#fff;border-right:1px solid var(--line);padding:34px 18px 22px}
.brand{padding:0 12px 26px;border-bottom:1px solid var(--line2)}
.brand .zwm{width:118px;color:#000}
.brand .wm{font-weight:500;letter-spacing:.36em;font-size:9.5px;margin-top:16px}
.brand .sub{font-size:8.5px;letter-spacing:.3em;color:var(--muted);margin-top:5px;font-weight:500}
.sidenav{margin-top:22px;gap:0}
.navbtn{border-radius:0;padding:12px 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:#77736c;position:relative;transition:color .2s,background .2s}
.navbtn .ic{width:16px;height:16px;stroke-width:1.4}
.navbtn:hover{background:transparent;color:#000}
.navbtn.active{background:transparent;color:#000;font-weight:650}
.navbtn.active::before{content:"";position:absolute;left:-18px;top:9px;bottom:9px;width:2px;background:#000}
.navbtn .badge{background:#000!important;color:#fff!important;border-radius:2px!important;height:17px!important;font-size:9.5px;letter-spacing:.04em}
.side .foot{border-top:1px solid var(--line2);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);line-height:1.8}
.side .who b{letter-spacing:.06em;text-transform:none}
.side .who div{text-transform:none;letter-spacing:.02em;font-size:10.5px;color:var(--muted)}
.side .who .av{border-radius:50%!important;background:#000}
main{padding:34px 44px 70px;max-width:1280px}

/* header */
.ph{margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:9px;letter-spacing:.3em;font-weight:500;color:var(--muted)}
.h1{font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:-.01em;margin:8px 0 4px;line-height:1}
.lead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph .right .pill{border-radius:0}

/* atoms */
.pill{border-radius:2px;height:21px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;background:var(--soft);color:#5e5a54}
.pill.line{border:1px solid var(--line);background:#fff}
.pill.pos,.pill.neg,.pill.amb{text-transform:none;letter-spacing:.02em}
.lbl{font-size:9px;letter-spacing:.22em;font-weight:600;color:var(--muted)}
.btn{border-radius:0;height:34px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border-color:var(--ink);background:transparent;transition:background .2s,color .2s,transform .08s}
.btn:hover{background:#000;color:#fff}
.btn.primary{background:#000;color:#fff;border-color:#000}
.btn.primary:hover{background:#262626}
.btn.sm{height:28px;font-size:9.5px;border-radius:0}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--soft);color:#000}
.btn.onDark{border-radius:0;border-color:rgba(255,255,255,.4);background:transparent}
.btn.white{border-radius:0}
.linkbtn{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.seg{background:transparent;border:1px solid var(--line);border-radius:0;padding:2px}
.seg button{border-radius:0;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#86827b;height:28px;transition:background .2s,color .2s}
.seg button.active{background:#000;color:#fff;box-shadow:none}
.seg.sm button{height:22px;font-size:9.5px;letter-spacing:.1em}
.chip{border-radius:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.chip.active{background:#000;border-color:#000}

/* cards */
.card{border-radius:var(--r);border-color:var(--line);padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.02);transition:box-shadow .25s var(--ease),border-color .25s}
.card.dark{background:#000;border-color:#000}
.card.dark .lbl,.card.dark .mini,.card.dark .muted{color:#8e8a83}
.ch{margin-bottom:18px;align-items:flex-start}
.ch h3{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:650}
.ch .t .mini{font-size:10.5px;letter-spacing:.01em}
.big{font-weight:300;letter-spacing:-.04em}
.metric{font-weight:400;letter-spacing:-.03em}
.grid{gap:16px}
.sec{margin:42px 0 16px;padding-bottom:10px;border-bottom:1px solid #000}
.sec h2{font-size:10.5px;letter-spacing:.32em;font-weight:650}
.sec .mini{letter-spacing:.1em;text-transform:uppercase;font-size:9px}
.divider{background:var(--line2)}
.delta{font-weight:600;font-size:10.5px;letter-spacing:.01em}
.card.dark .delta.pos{color:#8fcaa8}.card.dark .delta.neg{color:#e7a39d}
.notice{border-radius:var(--r-sm);background:var(--soft)}
.empty{border-radius:var(--r-sm)}

/* hero */
.hero{padding:26px 26px 22px;overflow:hidden}
.hero .big{font-size:58px;margin:18px 0 8px;font-weight:200;letter-spacing:-.045em}
.hero .pill{background:transparent!important;border:1px solid rgba(255,255,255,.22);color:#cfcac2!important}
.hero-spark{margin:14px -26px 0;height:52px;opacity:.95}
.hero-spark svg,.kpi .hero-spark .spark{width:100%;height:52px;display:block}
.hs-l{margin-top:6px;letter-spacing:.1em;text-transform:uppercase;font-size:8.5px}
.hero .sub2{gap:30px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.hero .sub2 .metric{font-weight:300;font-size:20px}
.kpi .metric{font-size:30px;font-weight:300;letter-spacing:-.04em;margin-top:6px}
.tk2 .metric{font-size:26px!important}
.mbars{height:52px;gap:6px}
.mbars i{border-radius:1px;background:#000}
.mbars i.g{background:var(--greige2);border:0}
.mbars span{font-size:8.5px;letter-spacing:.08em}

/* welcome / STORE AI */
.welcome{background:#000;border-radius:var(--r);padding:26px 28px;gap:28px}
.welcome::after{background:radial-gradient(closest-side,rgba(216,210,199,.10),transparent)}
.welcome h2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:0;margin:16px 0 8px}
.welcome p{color:#a9a49c}
.ai-av{border-radius:50%;width:32px;height:32px}
.req{border-radius:0;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.12);padding:11px 2px}
.req:hover{background:rgba(255,255,255,.04)}
.req .ri{border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,.22)}
.reqs{gap:0}

/* =================== v7 · SEMANA, CALENDARIO, NEGOCIO, STORE AI =================== */

.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}

.wd-d{font-family:var(--serif);font-size:30px;line-height:1;order:-1}

.wday.today .wd-h{background:#000;color:#fff;border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}

.imp-txt{width:100%;min-height:150px;border:1px solid var(--line);border-radius:0;padding:12px;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;outline:0;resize:vertical;background:var(--soft)}
.imp-txt:focus{border-color:#000;background:#fff}
.imp-err{color:var(--neg);font-size:11.5px;margin-top:8px;min-height:14px}
.nhead{padding:26px 26px 22px}
.nhead .pill{background:transparent!important;border:1px solid rgba(255,255,255,.22);color:#cfcac2!important}
.nh-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:end;margin-top:16px}
.nh-big{font-size:54px;font-weight:200;letter-spacing:-.045em;line-height:1}
.nh-big .nd{color:#fff;font-weight:700}
.nh-var{margin-top:8px;font-size:11px;letter-spacing:.06em;color:#a8a39b}
.nh-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-left:24px;border-left:1px solid rgba(255,255,255,.14)}
.card.dark .nk-v{color:#fff}.card.dark .nd{color:#fff}.card.dark .na{color:#8e8a83}.card.dark .pos{color:#8fcaa8}.card.dark .neg{color:#e7a39d}
.nk{display:flex;flex-direction:column;gap:5px;min-width:0}
.nk-v{font-size:20px;font-weight:300;letter-spacing:-.025em;line-height:1.1;white-space:nowrap}
.nk-s{font-size:10px;color:var(--muted);letter-spacing:.02em}
.lect{margin:18px 0 0;font-size:12.5px;line-height:1.6;color:#3a3833;padding-top:14px;border-top:1px solid var(--line2)}
.lect.on-dark{color:#cfcac2;border-top-color:rgba(255,255,255,.12)}
.lect.on-dark b{color:#fff}
.ed{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-left:4px;vertical-align:1px}
.ndrv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ndrv .nk{background:#fff;padding:16px 18px}
.nsecs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.nsec{padding:22px}
.nsec-h{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid #000}
.nsec-t{font-family:var(--serif);font-weight:400;font-size:30px;margin:4px 0 0;line-height:1;letter-spacing:0;text-transform:none}
.nsec-w{text-align:right;display:flex;flex-direction:column;gap:4px}.nsec-w b{font-size:20px;font-weight:300}
.nsec-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.nsec-k .nk-v{font-size:17px}
.pend{font-size:12px;font-weight:600;color:var(--amb);letter-spacing:.01em}
.nsub{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line2)}
.ntab{font-size:11.5px}
.nt-h,.nt-r{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,.8fr));gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.nt-h{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:0}
.nt-h span:not(:first-child),.nt-r span:not(:first-child){text-align:right}
.nt-r.ln{font-weight:600}
.nt-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipk{display:inline-block;font-size:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:2px 5px;border-radius:2px;vertical-align:1px;margin-left:4px}
.chipk.frena{background:var(--neg-bg);color:var(--neg)}.chipk.sostiene{background:var(--pos-bg);color:var(--pos)}
.ncob{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ncob .nk-v{font-size:15px}
.nempty{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);padding:8px 0}
.ntree{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px}
.ntree summary{cursor:pointer;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;list-style:none}
.ntree summary::before{content:"+ "}.ntree[open] summary::before{content:"− "}
.tr{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,.8fr)) auto;gap:6px;font-size:11px;padding:5px 0;border-bottom:1px solid var(--line2)}
.tr .tr-n{padding-left:calc(var(--d,0)*12px)}
.tr span:not(.tr-n){text-align:right}
.tr-h{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.tr-g{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.act{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.act input{position:absolute;opacity:0;pointer-events:none}
.act-t{font-size:12px;line-height:1.45;display:flex;flex-direction:column}
.act-c{font-weight:650}
.act.on .act-t{color:var(--muted)}
.act-p{font-size:10px;color:var(--faint)}
.aft{font-size:10.5px;font-weight:600;margin-top:2px}
.rad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.rad-c{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.rad-c.hot{border-color:#000}
.rad-n{font-size:40px;font-weight:200;letter-spacing:-.04em;line-height:1}
.rad-n .nd{font-weight:800}
.rad-i{display:flex;flex-direction:column;font-size:11px;padding-top:6px;border-top:1px solid var(--line2)}.rad-i span{color:var(--muted);font-size:10px}
.nr{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}
.nr-n{display:flex;flex-direction:column}
/* STORE AI */
.chat{padding:0;display:flex;flex-direction:column}
.chat-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.chat-n{letter-spacing:.2em;font-size:11px;font-weight:650}
.ai-av.dark{background:#000;color:#fff}
.chatlog{padding:16px;gap:14px}
.msgwrap{display:flex;gap:10px;align-items:flex-start}
.msgwrap.me{justify-content:flex-end}
.ai-dot{width:26px;height:26px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex:none;margin-top:2px}
.msgcol{display:flex;flex-direction:column;gap:8px;max-width:84%;min-width:0}
.msgwrap.me .msgcol{align-items:flex-end}
.msgcol .msg{max-width:100%}
.msg.ai{background:var(--soft);border-radius:2px var(--r) var(--r) var(--r);font-size:13px}
.msg.me{border-radius:var(--r) 2px var(--r) var(--r)}
.evcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:2px solid #000;border-radius:var(--r-sm);padding:10px 12px;min-width:240px}
.evcard.del{border-left-color:var(--neg)}.evcard.del b{text-decoration:line-through;color:var(--muted)}
.evcard.undone{opacity:.5}
.evd{width:38px;text-align:center;flex:none;border-right:1px solid var(--line2);padding-right:10px}
.evd b{display:block;font-family:var(--serif);font-size:22px;font-weight:400;line-height:1}
.evd span{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.evc-a{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.composer{margin:0 16px 16px}
.sugs{padding:8px 16px}
/* vacío */
.emptyc{text-align:center;padding:40px 24px}
.ec-i{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px}
.ec-t{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px}
.ec-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:640px;margin:20px auto 0;text-align:left}
.tdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line)}
.tdays button{height:32px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#86827b;border-right:1px solid var(--line);transition:background .2s,color .2s}
.tdays button:last-child{border-right:0}
.tdays button.active{background:#000;color:#fff}
@media (max-width:1100px){.nsecs{grid-template-columns:1fr 1fr}.rad{grid-template-columns:1fr 1fr}.ndrv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  :root{--lane:16px}
  .wask{margin-top:18px}
  .week{margin-top:24px}
  .week-t{font-size:26px}
  .week-r{flex-direction:column;align-items:flex-end;gap:6px}
  .wlanes{grid-template-columns:1fr;gap:6px}
  .wlanes .wspan{grid-column:1/-1!important}
  .wk7{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line);margin-top:10px}
  .wk7 .wday{flex-direction:row;min-height:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;box-shadow:none}
  .wk7 .wday.closed{background:transparent}
  .wk7 .wd-h{flex-direction:column;align-items:flex-start;gap:4px;width:64px;flex:none;border-bottom:0;padding:14px 0 12px 2px}
  .wk7 .wd-d{order:0;font-size:28px}
  .wk7 .wd-tag{margin-left:0}
  .wk7 .wday.today .wd-h{background:transparent;color:#000;border-radius:0}
  .wk7 .wday.today{position:relative}
  .wk7 .wday.today::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:2px;background:#000}
  .wk7 .wday.today .wd-n{color:#000}
  .wk7 .wday.today .wd-tag{background:#000;color:#fff}
  .wk7 .wd-b{padding:12px 0 12px 8px;gap:6px}
  .wk7 .wd-multi{display:none}
  .wk7 .wplus{margin-top:0;align-self:flex-start;padding:4px 0}
  .wk7 .wi{padding:8px 10px}
  .wk7 .wi-t{font-size:13px}
  .wadd{border-top:0}
  .cw.wk7 .wd-multi{display:flex}
  .caltitle{min-width:120px;font-size:17px}
  .mhd span{padding:8px 4px;letter-spacing:.1em;text-align:center}
  .mwk{min-height:74px;row-gap:2px;padding-bottom:4px}
  .mday{padding:4px 3px;justify-content:center}
  .mdn{font-size:11px;width:20px;height:20px}
  .mopen{display:none}
  .mbar{font-size:8.5px;margin:0 1px;padding:0 3px;gap:3px}
  .mbar.single i{display:none}
  .mbar.single{color:#000;background:var(--soft)}
  .mbar.trk{display:none}
  .mbar b{display:none}
  .mmore{font-size:8px;right:3px;bottom:2px}
  .nh-main{grid-template-columns:1fr;gap:18px}
  .nh-big{font-size:42px}
  .nh-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding-left:0;border-left:0;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
  .nhead{padding:20px}
  .ndrv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ndrv .nk{padding:14px}
  .nsecs{grid-template-columns:1fr}
  .nsec{padding:18px}
  .ncob{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nt-h,.nt-r{grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,.8fr))}
  .rad{grid-template-columns:1fr 1fr;gap:10px}
  .rad-c{padding:14px}.rad-n{font-size:32px}
  .ec-form{grid-template-columns:1fr}
  .chatlog{padding:12px}
  .msgcol{max-width:88%}
  .evcard{min-width:0}
  .composer{margin:0 12px 12px}
  .sugs{padding:8px 12px}
}

/* v7 · después + tablas */
.wnext{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line,#e4e0d8)}
.wnext .lbl{margin-right:4px}
.wn-i{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;font-size:13px}
.wn-i b{font-weight:600}.wn-i .wi-m{color:var(--muted,#8a857c);font-size:12px}
.ntab .num,.ntree .num,.tr .num{white-space:nowrap}
@media (max-width:900px){.wnext{flex-direction:column;align-items:flex-start;gap:8px}.ntree{font-size:11.5px}}
@media (max-width:900px){.wday.past .wplus{display:none}.wday.past .wd-b{min-height:0}}

:root{--sans:"InterSM",-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;--serif:var(--sans)}
body,button,input,select,textarea{font-family:var(--sans)}
body{font-size:13.5px;font-weight:400;letter-spacing:-.006em;font-feature-settings:"tnum" 1,"calt" 1,"cv05" 1;font-optical-sizing:auto}
.num,.kv-n,.big,.metric,.wd-d,.evd b,.nh-big,.rad-n{font-variant-numeric:tabular-nums}
b,strong{font-weight:560}
/* rótulos pequeños: mayúsculas con aire */
.eyebrow,.lbl,.wd-n,.mhd span{font-weight:500;letter-spacing:.2em;font-size:9.5px}
.lead{font-size:10.5px;letter-spacing:.16em;font-weight:400}
.pill,.chip,.btn,.seg button,.linkbtn{font-weight:500}
.btn{letter-spacing:.14em}
/* titulares: finos, sin serif */
.h1{font-family:var(--sans);font-weight:300;font-size:36px;letter-spacing:-.03em;line-height:1.05}
.hello-t{font-size:40px;font-weight:250;letter-spacing:-.035em;margin:10px 0 6px}
.week-t,.bh-t,.welcome h2,.ec-t{font-family:var(--sans);font-weight:300;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.nsec-t{font-family:var(--sans);font-weight:400;font-size:22px;letter-spacing:-.02em}
.caltitle{font-family:var(--sans);font-weight:400;font-size:15px;letter-spacing:-.01em}
/* números grandes: finos y limpios */
.wd-d{font-family:var(--sans);font-weight:200;font-size:28px;letter-spacing:-.04em}
.evd b{font-family:var(--sans);font-weight:250;font-size:22px;letter-spacing:-.03em}
.cday1 .cd-big{font-family:var(--sans);font-weight:200;letter-spacing:-.04em}
.nh-big,.hero .big{font-weight:200;letter-spacing:-.045em}
.rad-n,.bprog .num{font-weight:200}
.kv-n,.kpi .metric,.metric{font-weight:300}
.wd-tag{font-weight:500;letter-spacing:.16em}
@media (max-width:900px){.h1{font-size:28px}.hello-t{font-size:30px}.week-t{font-size:20px}.wk7 .wd-d{font-size:26px}}

/* ================= v8 · Inicio más limpio ================= */
.hello{padding-bottom:4px}
.wask{border-bottom:1px solid var(--ink)}
.week-h{align-items:flex-end}
.wsum{display:inline-flex;align-items:baseline;gap:7px;margin-right:14px;font-size:12px}
.wsum b{font-weight:400}
.wsum .lbl{font-size:9px}
.wday{transition:background .2s}
.wi{font-weight:400}.wi-t{font-weight:500}
/* venta diaria: línea muy sutil */
.wsale{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:0 0 2px;margin:0 0 8px;cursor:pointer;color:var(--muted);font:inherit;text-align:left;min-height:16px}
.ws-bar{flex:1;min-width:18px;height:1px;background:#e6e3dd;position:relative}
.ws-bar i{position:absolute;left:0;top:-.5px;height:2px;background:#bdb8af;border-radius:2px}
.ws-v{font-size:10.5px;letter-spacing:.01em;color:#8f8a82;white-space:nowrap}
.ws-p{font-size:10px;color:#a9a49b;white-space:nowrap}
.wsale.peak .ws-bar i{background:var(--ink)}
.wsale.peak .ws-v{color:var(--ink);font-weight:500}
.wsale.pos .ws-p{color:var(--pos)}.wsale.neg .ws-p{color:var(--neg)}.wsale.top .ws-p{color:var(--ink)}
.ws-dot{width:5px;height:5px;border-radius:50%;background:var(--ink);flex:none}
.wsale.pos .ws-dot{background:var(--pos)}.wsale.neg .ws-dot{background:var(--neg)}
.wsale.empty{min-height:14px}
.wsale.empty .ws-bar{background:#efede9}
.ws-add{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:transparent;transition:color .2s}
.wsale.empty:hover .ws-add,.wsale.empty:focus-visible .ws-add{color:var(--muted)}
.wday.past .wsale.empty .ws-bar{background:#ebe8e3}
/* formulario rápido de venta */
.wsf{border:1px solid var(--line);background:#fff;padding:12px;margin:0 0 10px;display:flex;flex-direction:column;gap:10px}
.wsf-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wsf-h input{height:30px;border:1px solid var(--line);padding:0 8px;font-size:12px;background:#fff;color:var(--ink)}
.wsf-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wsf-g label{display:flex;flex-direction:column;gap:4px;min-width:0}
.wsf-g label span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.wsf-g label i{font-style:normal;text-transform:none;letter-spacing:0;color:var(--faint)}
.wsf-g input{height:34px;border:0;border-bottom:1px solid var(--line);padding:0 2px;font-size:15px;font-weight:300;background:transparent;color:var(--ink);width:100%;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.wsf-g input:focus{border-bottom-color:var(--ink)}
.wsf-a{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk7 .wsf .btn{padding:0 10px}
@media (min-width:901px){.wk7 .wsf .wsf-g{grid-template-columns:1fr}.wk7 .wsf .wsf-a{flex-direction:column-reverse;align-items:stretch}.wk7 .wsf .wsf-a .hstack{justify-content:space-between}}
.wa-sale{flex-basis:100%;text-align:left;font-size:10px;margin-top:2px}
/* STORE AI · capturas */
.composer .cam{flex:none;cursor:pointer}
.msg.img{padding:4px;background:#000}
.msg-img{display:block;max-width:150px;max-height:200px;width:auto;height:auto;object-fit:cover}
.msg-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.dark{background:#000;color:#fff;border-color:#000}
.chip{display:inline-flex;align-items:center;gap:6px}.chip .ic{width:12px;height:12px;margin:0;flex:none}
.chat-form{padding:4px 0 6px 34px}
.chat-form .wsf{margin:0}
.evcard.sale .grow b span{font-weight:400;margin-left:4px}

/* v8 · ajustes tras revisión */
.wday.past{opacity:1}
.wday.past .wd-h,.wday.past .wi,.wday.past .wtask,.wday.past .wfree,.wday.past .wplus,.wday.past .wd-multi{opacity:.5}
@media (max-width:900px){.wk7{border-top:0;margin-top:4px}}
@media (min-width:901px){
 .wsale{flex-wrap:wrap;gap:3px 6px;padding:2px 0 4px}
 .wsale .ws-bar{order:3;flex-basis:100%;margin-top:3px}
 .wsale.empty{min-height:10px}
 .wsale.empty .ws-add{order:1}
 .wday.closed .wd-tag.soft{display:none}
}
@media (max-width:900px){.nbar{flex-wrap:wrap;gap:10px}.nbar>.hstack:last-child{width:100%}.nbar>.hstack:last-child .btn.primary{flex:1;letter-spacing:.1em}}
/* ================= v9 · Negocio conciso: pestañas y desplegable ================= */
.nsum{padding:20px 22px}
.nsum-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.nsum .nk-v{font-size:22px;font-weight:250;letter-spacing:-.03em}
.nsum .lect{margin-top:14px;padding-top:12px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line2)}

          ticketVar:sc.ticketVar??b.ticketVar??null,
          precio:b.precioMedio??null,precioVar:b.precioMedioVar??null,

/* ---- lecturas cortas ---- */
function lecturaTienda(r){
  if(!r)return '';
  if(typeof r.lectura==='string'&&r.lectura.trim())return esc(r.lectura);
  const v=g(r,'inicio','importe','var'),vis=g(r,'drivers','visitas','var'),G=gapOf(netVar(r),vis);
  const top=secKeys(r).map(k=>[k,g(r,'secciones',k,'venta','peso')]).filter(x=>isNum(x[1])).sort((a,b)=>b[1]-a[1])[0];
  if(!isNum(v)&&!isNum(vis))return '';
  let t='';
  if(isNum(v))t+=`Venta <b class="${tone(v)}">${fP(v)}</b> vs A-1`;
  if(isNum(vis))t+=(t?' frente a visitas ':'Visitas ')+`<b class="${tone(vis)}">${fP(vis)}</b>`;
  if(isNum(G))t+=(t?'. ':'')+`GAP neto <b class="${tone(G)}">${fPP(G)}</b>`;
  if(top)t+=(t?' · ':'')+`Lo que más pesa es <b>${secLbl(top[0])}</b>`;
  return t;
}
function lecturaSec(k,sc){
  if(!sc)return '';
  if(typeof sc.lectura==='string'&&sc.lectura.trim())return esc(sc.lectura);
  const v=g(sc,'venta','var'),p=g(sc,'venta','peso');if(!isNum(v))return '';
  return `<b>${secLbl(k)}</b> ha ${v>=0?'crecido':'caído'} <b class="${tone(v)}">${fPct(Math.abs(v))}</b>`+
    (isNum(p)?`, peso <b>${fPct(p)}</b> de la tienda`:'')+'.';
}

/* ---- posibles problemas: hasta 3 líneas, con chips frena/sostiene ---- */
function problemas(k,sc,rep){
  const items=[],v=g(sc,'venta','var'),tv=visVar(sc),G=gapOf(v,tv);
  const comps=compradoresOf(sc),fams=familiasOf(sc),all=[...fams,...comps];
  const seen=new Set();
  const push=(t,ch,key)=>{if(!t||seen.has(key||t)||items.length>=3)return;seen.add(key||t);items.push({t,ch})}
  all.filter(x=>isNum(x.ventaVar)&&isNum(v)&&x.ventaVar<0&&v>0)
    .sort((a,b)=>a.ventaVar-b.ventaVar||(b.peso||0)-(a.peso||0))
    .forEach(x=>push(`<b>${esc(x.nombre)}</b> cae <span class="${tone(x.ventaVar)}">${fP(x.ventaVar)}</span>`,'frena','f-'+x.nombre));
  if(isNum(G)&&G<=-1)push(`GAP <span class="neg">${fPP(G)}</span>: la venta no acompaña a las visitas`,'','gap');
  all.filter(x=>isNum(x.ventaVar)&&isNum(x.zonaVar)&&x.ventaVar<x.zonaVar&&x.ventaVar<=0)
    .sort((a,b)=>(a.ventaVar-a.zonaVar)-(b.ventaVar-b.zonaVar))
    .forEach(x=>push(`<b>${esc(x.nombre)}</b> no supera y la zona va mejor`,'frena','z-'+x.nombre));
  const drv=secDrivers(rep,k);
  if(isNum(drv.conversion)&&isNum(drv.convVar)&&drv.convVar<0)push(`Conversión ${fPct(drv.conversion)} (<span class="neg">${fPP(drv.convVar)}</span>)`,'','conv');
  all.filter(x=>isNum(x.ventaVar)&&x.ventaVar<=-5&&isNum(x.peso)&&x.peso>=8&&!(isNum(v)&&v>0&&x.ventaVar<0))
    .sort((a,b)=>a.ventaVar-b.ventaVar)
    .forEach(x=>push(`<b>${esc(x.nombre)}</b> cae <span class="${tone(x.ventaVar)}">${fP(x.ventaVar)}</span> con peso ${fPct(x.peso)}`,'','d-'+x.nombre));
  return items.slice(0,3);
}

/* ---- normalización (actual + A-1 → % vs A-1) ---- */
function normalizeReport(o){
  if(!o||typeof o!=='object')return o;
  const r=JSON.parse(JSON.stringify(o));
  fillVar(g(r,'inicio','importe'),'valor','a1','var');
  fillVar(g(r,'inicio','unidades'),'valor','a1','var');
  fillVar(g(r,'drivers','visitas'),'valor','a1','var');
  const secs=r.secciones||{};
  const out={};
  Object.keys(secs).forEach(k=>{
    const nk=normSec(k),sc=secs[k]||{};
    fillVar(sc.venta||(sc.venta={}),'importe','a1','var');
    fillVar(sc.visitas,'valor','a1','var');
    if(!isNum(sc.traficoVar)&&isNum(g(sc,'visitas','var')))sc.traficoVar=sc.visitas.var;
    (sc.compradores||[]).forEach(x=>fillVar(x,'venta','a1','ventaVar'));
    (sc.familias||[]).forEach(x=>fillVar(x,'venta','a1','ventaVar'));
    out[nk]=sc;
  });
  r.secciones=out;
  return r;
}

function saveManual(){
  flushManual();const D=S.negDraft;if(!D)return;
  const prev=(S.report&&typeof S.report==='object')?JSON.parse(JSON.stringify(S.report)):{};
  const imp={...(g(prev,'inicio','importe')||{})};if(isNum(D.venta))imp.valor=D.venta;if(isNum(D.ventaA1))imp.a1=D.ventaA1;if(isNum(D.ventaVar))imp.var=D.ventaVar;fillVar(imp,'valor','a1','var');

  const secciones={...(prev.secciones||{})};
  Object.keys(D.secciones||{}).forEach(k=>{
    const s=D.secciones[k],cur=secciones[k]||{};

function taskCard(t){const late=!t.done&&t.date<iso(TODAY);return `<div class="task ${t.done?'done':''}"><div class="tt"><button class="tick ${t.done?'on':''}" onclick="toggleTask(${t.id},${!t.done})" aria-label="Completar">${t.done?ic('check'):''}</button><div class="grow ttl">${esc(t.text)}</div><button class="iconbtn" style="width:22px;height:22px;color:var(--faint)" onclick="deleteTask(${t.id})" title="Eliminar">${ic('x','sm')}</button></div><div class="meta"><span class="pill ${t.priority==='Alta'?'amb':''}">${esc(t.priority)}</span><span class="mini">${ic('clock','sm').replace('class="ic sm"','class="ic sm" style="display:inline;vertical-align:-2px;width:11px;height:11px"')} ${t.date===iso(TODAY)?'Hoy':dshort(parse(t.date))}${late?' · <b class="neg">vencida</b>':''}</span><span class="mini">· ${esc(t.owner)}</span></div></div>`}

/* ---------- Mercancía · previsión de camión ---------- */
function merchCalc(){
  const h=Math.max(0,hm(S.shiftEnd)-hm(S.shiftStart)),pr=+S.pickRate||550,er=+S.peelRate||135,pc=(+S.peelPct||0)/100;
  const secs=SECTIONS.map((n,i)=>{const u=Math.max(0,+S.pack[i]||0),pick=u/pr,peelU=Math.round(u*pc),peel=peelU/er;return {n,u,pick,peelU,peel,tot:pick+peel,ppl:h?(pick+peel)/h:0,hang:Math.max(0,+S.hang[i]||0)}});
  const pack=sum(secs.map(s=>s.u)),hang=sum(secs.map(s=>s.hang)),pick=sum(secs.map(s=>s.pick)),peel=sum(secs.map(s=>s.peel)),tot=pick+peel;
  const need=h?Math.ceil(tot/h-1e-9):0,staff=+S.staff||0,end=staff?hm(S.shiftStart)+tot/staff:null;
  return {h,secs,pack,hang,truck:pack+hang,pick,peel,tot,need,staff,end,peelU:sum(secs.map(s=>s.peelU)),pr,er};
}
function stepper(id,val,step=1){return `<div class="stepper"><button onclick="bump('${id}',-${step})" aria-label="Menos">−</button><input id="${id}" inputmode="numeric" value="${esc(val)}" onchange="fieldSet('${id}',this.value)"><button onclick="bump('${id}',${step})" aria-label="Más">+</button></div>`}
function bump(id,d){const el=$(id);fieldSet(id,Math.max(0,(+el.value||0)+d))}
function fieldSet(id,v){
  if(id.startsWith('pack'))S.pack[+id.slice(4)]=Math.max(0,+v||0);
  else if(id.startsWith('hang'))S.hang[+id.slice(4)]=Math.max(0,+v||0);
  else if(['staff','pickRate','peelRate','peelPct'].includes(id))S[id]=Math.max(0,+v||0);
  else S[id]=v;
  save();render();
}

  return `<div class="grid g12">
   <div class="card dark s7">
    <div class="row"><span class="lbl">Previsión de camión · ${dlong(md)}</span><span class="pill" style="background:#2a2c30;color:#ddd">${ic('truck','sm')} Cálculo</span></div>
    <div class="need mneed" style="margin-top:14px;align-items:center">
     ${ring(C.need?Math.min(1,C.staff/C.need):1,innerWidth<900?104:128,innerWidth<900?9:11,ok?'#5fd39a':'#ff8a80','rgba(255,255,255,.12)',`<div><div style="font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1">${C.pack?C.need:"–"}</div><div class="mini" style="color:#9a9ca1">personas<br>necesarias</div></div>`)}
     <div class="grow" style="min-width:200px">
      <div class="big num" style="font-size:30px">${fmt(C.truck)} <span class="mini">uds</span></div>
      <div class="mini" style="color:#9a9ca1">total camión · ${fmt(C.pack)} paquetería + ${fmt(C.hang)} confección</div>
      <div class="hstack wrap" style="gap:14px;margin-top:8px"><div><div class="lbl">Horas equipo</div><div class="metric s num">${fmt(C.tot,1)} <span class="mini">h BACK</span></div></div><div><div class="lbl">Turno</div><div class="metric s">${S.shiftStart}–${S.shiftEnd}</div></div></div>
     </div>
    </div>
    <div class="divider"></div>
    <div class="row"><span class="small" style="color:#c9cbcf">Con <b style="color:#fff">${C.staff} personas</b> terminaríais a las <b style="color:#fff">${C.end===null?'—':hhmm(C.end)}</b><span style="color:#8e8a83"> · sobre paquetería</span></span><span class="pill ${ok?'pos':'neg'}">${ok?(diff?'Sobran '+diff:'Justo'):'Faltan '+(-diff)}</span></div>
    <div class="timeline" style="background:rgba(255,255,255,.1)"><div class="tf ${ok?'':'over'}" style="width:${endPct}%;${ok?'background:#fff':''}"></div><div class="lim" style="left:${limPct}%"></div></div>

   </div>

    <div class="field" style="margin-top:12px"><label>Días de camión · se muestran en tu semana</label><div class="tdays">${[1,2,3,4,5,6,0].map(i=>`<button class="${(S.truckDays||[]).includes(i)?'active':''}" onclick="toggleTruckDay(${i})">${DOW[i].slice(0,3)}</button>`).join('')}</div></div>
    <button class="detail-toggle ${S.paramsOpen?'open':''}" onclick="set('paramsOpen',!S.paramsOpen)"><span>Productividades BACK</span>${ic('chev','sm')}</button>
    ${S.paramsOpen?`<div class="grid g3 fade" style="gap:8px;margin-top:10px"><div class="field"><label>Picking uds/h</label><input id="pickRate" inputmode="numeric" value="${S.pickRate}" onchange="fieldSet('pickRate',this.value)"></div><div class="field"><label>Pel. y perch. uds/h</label><input id="peelRate" inputmode="numeric" value="${S.peelRate}" onchange="fieldSet('peelRate',this.value)"></div><div class="field"><label>% a pelar</label><input id="peelPct" inputmode="numeric" value="${S.peelPct}" onchange="fieldSet('peelPct',this.value)"></div></div>`:`<div class="mini" style="margin-top:8px">Picking ${C.pr} uds/h · Pelado y perchado ${C.er} uds/h sobre el ${S.peelPct} % de la paquetería (lo que se queda en tienda) · FRONT se definirá más adelante.</div>`}
    <div class="hstack" style="margin-top:14px"><button class="btn primary grow" onclick="saveTruck()">${ic('check','sm')} ${S.truckSaved===S.merchDate?'Previsión registrada':'Registrar previsión'}</button></div>
   </div>
  </div>
  <div class="sec"><h2>El camión</h2><span class="mini">Paquetería y confección, un mismo envío</span></div>

   <div class="trk-tot"><div><span class="lbl">Total camión</span><div class="trk-n num">${fmt(C.truck)} <span class="mini">uds</span></div></div>

function arr3(a){const x=Array.isArray(a)?a.slice(0,3).map(n=>Math.max(0,+n||0)):[];while(x.length<3)x.push(0);return x}
function hangKnown(o){return !!(o&&Array.isArray(o.hang))}
function normalizeTruckEntry(t){
  if(!t||typeof t!=='object')return t;
  t.forecast=t.forecast||{};t.real=t.real||{};
  if(Array.isArray(t.forecast.pack)){t.forecast.pack=arr3(t.forecast.pack);if(t.forecast.packTot==null)t.forecast.packTot=sum(t.forecast.pack)}
  if(Array.isArray(t.real.pack)){t.real.pack=arr3(t.real.pack);if(t.real.packTot==null)t.real.packTot=sum(t.real.pack)}
  if(Array.isArray(t.forecast.hang)){t.forecast.hang=arr3(t.forecast.hang);t.forecast.hangTot=sum(t.forecast.hang)}
  if(Array.isArray(t.real.hang)){t.real.hang=arr3(t.real.hang);t.real.hangTot=sum(t.real.hang)}
  const add=(o)=>{const p=+o.packTot||0,h=Array.isArray(o.hang)?(+o.hangTot||0):null;o.truckTot=h==null?p:p+h};
  add(t.forecast);add(t.real);return t;
}
function migrateTrucks(){if(!Array.isArray(S.trucks))return;S.trucks=S.trucks.map(normalizeTruckEntry)}
function squareDraft(){
  const ed=(S.trucks||[]).find(t=>t.id===S.truckEdit);
  if(ed){const r=ed.real||{};return {date:ed.date,pack:arr3(r.pack),hang:hangKnown(r)?arr3(r.hang):arr3(S.hang),staff:r.staff,end:r.end||ed.end,start:ed.start||S.shiftStart}}
  const C=merchCalc();
  return {date:S.merchDate,pack:arr3(S.pack),hang:arr3(S.hang),staff:+S.staff||C.need||0,end:C.end!=null?hhmm(C.end):S.shiftEnd,start:S.shiftStart};
}
function saveSquare(){
  const date=$('cq-date')?.value,end=$('cq-end')?.value||S.shiftEnd,start=S.shiftStart;
  const pack=SECTIONS.map((_,i)=>Math.max(0,+$('cq-pack'+i)?.value||0)),packTot=sum(pack);
  const hang=SECTIONS.map((_,i)=>Math.max(0,+$('cq-hang'+i)?.value||0)),hangTot=sum(hang);
  const staff=Math.max(0,+$('cq-staff')?.value||0);
  if(!date)return toast('Indica la fecha');
  if(!packTot&&!hangTot&&!staff)return toast('Indica las unidades reales o las personas');
  S.trucks=S.trucks||[];
  const prev=S.trucks.find(t=>t.id===S.truckEdit);
  const C=merchCalc();
  const forecast=prev&&prev.forecast?{...prev.forecast}:{pack:arr3(S.pack),packTot:sum(S.pack||[]),hang:arr3(S.hang),hangTot:sum(S.hang||[]),need:C.need,staff:+S.staff||C.need||0,end:C.end!=null?hhmm(C.end):S.shiftEnd};
  if(!Array.isArray(forecast.hang)){forecast.hang=arr3(forecast.hang);forecast.hangTot=sum(forecast.hang)}
  forecast.truckTot=(+forecast.packTot||0)+(+forecast.hangTot||0);
  const hours=hoursOf(start,end),prod=prodOf(packTot,staff,hours);
  const real={pack,packTot,hang,hangTot,truckTot:packTot+hangTot,staff,end};
  const entry=normalizeTruckEntry({id:prev?prev.id:Date.now(),date,start,end,forecast,real,prod,hours});
  if(prev)S.trucks=S.trucks.map(t=>t.id===prev.id?entry:t);
  else S.trucks.unshift(entry);
  S.trucks.sort((a,b)=>b.date.localeCompare(a.date)||(b.id-a.id));
  S.truckEdit=null;S.squareOpen=false;save();render();toast(prev?'Camión actualizado':'Camión cuadrado');
}
function deleteSquare(id){
  if(!confirm('¿Borrar este camión cuadrado?'))return;
  S.trucks=(S.trucks||[]).filter(t=>t.id!==id);if(S.truckEdit===id)S.truckEdit=null;save();render();toast('Camión borrado');
}
function accOf(f,r){if(!isFinite(f)||!isFinite(r)||f===0)return null;return Math.max(0,1-Math.abs(r-f)/Math.abs(f))}
function truckStats(list){
  const P=list.map(t=>t.prod).filter(v=>typeof v==='number'&&isFinite(v)&&v>0);
  const A=list.map(t=>accOf(t.forecast&&t.forecast.packTot,t.real&&t.real.packTot)).filter(v=>v!=null);
  return {prod:P.length?P.reduce((a,b)=>a+b,0)/P.length:null,acc:A.length?A.reduce((a,b)=>a+b,0)/A.length:null,n:list.length};
}

  return L.sort((x,y)=>x.s.localeCompare(y.s)||(y.e.localeCompare(x.e))||(x.ord||x.time||'97').localeCompare(y.ord||y.time||'97'));

function calMonth(d){

function hintFor(e){const d=parse(e.date),diff=Math.round((d-TODAY)/864e5),st=monday(TODAY);

  if(same.length)return ` Ojo, ese día también tienes ${same.map(x=>lowFirst(x.title)).join(' y ')}.`;

  if(diff<=31)return ` Faltan ${diff} días; lo verás en el calendario del mes.`;

function listTxt(a,b,label){
  const L=S.events.filter(e=>e.date<=b&&evEnd(e)>=a).sort((x,y)=>x.date.localeCompare(y.date)||(x.time||'99').localeCompare(y.time||'99'));

  const lines=L.map(e=>{const d=parse(e.date);return `• ${e.end&&e.end!==e.date?rangeTxt(e):DOW[d.getDay()].slice(0,3)+' '+d.getDate()}${e.time?' · '+e.time:''} — ${e.title}`});
