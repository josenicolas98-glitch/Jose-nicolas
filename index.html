<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STORE MANAGER">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>STORE MANAGER 1.0 · Maisonnave 076</title>
<style>
:root{
  --bg:#f4f4f2;--card:#fff;--ink:#0b0b0c;--ink2:#2b2c2f;--muted:#83858a;--faint:#b3b5b9;
  --line:#e7e7e4;--line2:#efefec;--soft:#f3f3f1;--dark:#0e0f11;--dark2:#1b1c1f;
  --pos:#167a4a;--pos-bg:#e7f3ec;--neg:#b42318;--neg-bg:#fbeceb;--amb:#a5620a;--amb-bg:#fbf1e1;
  --r:18px;--r-sm:12px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.42 var(--sans);font-feature-settings:"tnum" 1,"ss01" 1;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #6b7280;outline-offset:2px;border-radius:8px}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}.ic.lg{width:22px;height:22px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 14px 18px}
.brand{padding:0 12px}
.brand .wm{font-weight:800;letter-spacing:.2em;font-size:14px;white-space:nowrap}
.brand .sub{font-size:9.5px;letter-spacing:.2em;color:var(--muted);margin-top:5px;font-weight:600}
.sidenav{margin-top:34px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:#5b5d62;font-weight:550;font-size:13.5px;text-align:left;transition:background .15s}
.navbtn:hover{background:var(--soft)}
.navbtn.active{background:var(--dark);color:#fff}
.navbtn .badge{margin-left:auto}
.side .foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line2);font-size:10.5px;color:var(--muted);line-height:1.55}
.side .who{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mainwrap{min-width:0}
.mhead{display:none}
main{padding:26px 34px 60px;max-width:1240px;margin:0 auto}
.tabbar{display:none}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.eyebrow{font-size:9.5px;letter-spacing:.17em;font-weight:700;color:var(--muted);text-transform:uppercase}
.h1{font-size:30px;font-weight:750;letter-spacing:-.035em;margin:4px 0 2px;line-height:1.1}
.lead{color:var(--muted);font-size:12.5px}
.ph .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- atoms ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;background:var(--soft);color:#55575c;font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.pill.dark{background:var(--dark);color:#fff}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.neg{background:var(--neg-bg);color:var(--neg)}.pill.amb{background:var(--amb-bg);color:var(--amb)}
.pill.line{background:transparent;border:1px solid var(--line)}
.pill.demo{background:#fff;border:1px solid var(--ink);color:var(--ink);letter-spacing:.14em;font-weight:800;font-size:9.5px}
.pill.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amb)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pos{color:var(--pos)}.neg{color:var(--neg)}.amb{color:var(--amb)}.muted{color:var(--muted)}
.mini{font-size:10.5px;color:var(--muted)}.small{font-size:12px}
.lbl{font-size:9.5px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hstack{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.primary:hover{background:#26282c}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.onDark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
.btn.onDark:hover{background:rgba(255,255,255,.18)}
.btn.white{background:#fff;color:var(--ink);border-color:#fff}
.linkbtn{color:var(--ink);font-weight:600;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.linkbtn.muted{color:var(--muted)}

.seg{display:inline-flex;background:#e9e9e6;border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-weight:600;font-size:12px;color:#606267;white-space:nowrap}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.seg.sm button{height:24px;padding:0 10px;font-size:11px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;position:relative}
.card.flat{box-shadow:none}
.card.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.card.dark .lbl,.card.dark .mini,.card.dark .muted{color:#9a9ca1}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch .seg{flex:none}
.ch h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.ch .t{display:flex;flex-direction:column;gap:2px}
.big{font-size:34px;font-weight:760;letter-spacing:-.045em;line-height:1.05}
.metric{font-size:22px;font-weight:720;letter-spacing:-.035em;line-height:1.1}
.metric.s{font-size:18px}
.grid{display:grid;gap:14px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec h2{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:750}
.divider{height:1px;background:var(--line2);margin:14px 0}
.card.dark .divider{background:rgba(255,255,255,.1)}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:11px}
.delta.pos{color:var(--pos)}.delta.neg{color:var(--neg)}
.card.dark .delta.pos{color:#5fd39a}.card.dark .delta.neg{color:#ff8a80}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:12px}
.notice{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:11.5px;color:#55575c;display:flex;gap:9px;align-items:flex-start}
.notice .ic{margin-top:1px}

/* ---------- AI welcome ---------- */
.welcome{background:var(--dark);color:#fff;border-radius:22px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent);pointer-events:none}
.ai-av{width:34px;height:34px;border-radius:11px;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.welcome h2{font-size:20px;margin:10px 0 4px;letter-spacing:-.03em;font-weight:720}
.welcome p{margin:0;color:#b9bbc0;font-size:12.5px}
.welcome .quick{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.req{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);text-align:left;width:100%;color:#fff;transition:background .15s}
.req:hover{background:rgba(255,255,255,.11)}
.req .ri{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.req b{font-size:12.5px;font-weight:620;display:block}
.req span.mini{color:#9a9ca1}
.reqs{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.askbar{display:flex;gap:8px;margin-top:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:4px 4px 4px 12px;align-items:center}
.askbar input{flex:1;background:transparent;border:0;outline:0;color:#fff;min-width:0;height:30px}
.askbar input::placeholder{color:#8e9095}
.askbar button{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--ink);display:grid;place-items:center}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.kpi .spark{height:30px;width:96px}
.hero .big{font-size:36px;margin:8px 0 2px}
.hero .sub2{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.hero .sub2>div{display:flex;flex-direction:column;gap:1px}

/* ---------- bar chart ---------- */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;height:200px;align-items:end;position:relative;padding-top:6px}
.bars::before{content:"";position:absolute;inset:6px 0 26px 0;background:repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px 25%);pointer-events:none}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;position:relative;cursor:pointer;border-radius:10px;padding:0 2px}
.bcol .bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bcol .bar{width:min(42px,72%);border-radius:7px 7px 3px 3px;background:var(--dark);position:relative;transition:height .35s cubic-bezier(.2,.8,.2,1),background .15s}
.bcol .bar.prev{position:absolute;bottom:0;background:transparent;border:1.5px dashed #c9cac7;z-index:0}
.bcol .bar.ghost{background:repeating-linear-gradient(135deg,#ecece9 0 5px,#f6f6f4 5px 10px);border:1px solid #e1e1de}
.bcol .bar.ly{background:#cfd0cc}
.bcol .bar.today{background:#fff;border:1.5px dashed var(--ink)}
.bcol .val{font-size:10.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bcol .dl{font-size:10px;font-weight:700;white-space:nowrap;height:14px}
.bcol .dl.pos{color:var(--pos)}.bcol .dl.neg{color:var(--neg)}
.bcol .dlab{font-size:10.5px;color:var(--muted);font-weight:600;height:20px;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.bcol .dlab b{color:var(--ink);font-size:11px}
.bcol.sel{background:var(--soft)}
.bcol.sel .bar:not(.prev):not(.ghost){background:#3a3c41}
.bcol .flag{position:absolute;top:-4px;width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg-box{width:10px;height:10px;border-radius:3px;display:inline-block}

.detail-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 2px 2px;border-top:1px solid var(--line2);margin-top:12px;font-weight:650;font-size:12px}
.detail-toggle .ic{transition:transform .2s}
.detail-toggle.open .ic{transform:rotate(180deg)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr:last-child td{border-bottom:0}
table.t tr.sel td{background:var(--soft)}
table.t tr.click{cursor:pointer}
table.t tr.tot td{font-weight:750;border-top:1px solid var(--line)}

/* ---------- misc viz ---------- */
.hbar{display:grid;grid-template-columns:62px 1fr 52px;align-items:center;gap:10px;margin:9px 0}
.track{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;position:relative}
.fill{height:100%;border-radius:9px;background:var(--dark)}
.stack100{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px}
.stack100>div{height:100%}
.zrow{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.zrow:last-child{border-bottom:0}
.zbars{display:flex;flex-direction:column;gap:3px}
.zbars .track{height:5px}
.zbars .fill.z{background:#bdbeba}
.gapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gapcell{background:var(--soft);border-radius:12px;padding:10px}
.qa{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .12s,box-shadow .15s;min-height:112px}
.qcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px rgba(0,0,0,.25)}
.qcard .qi{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.qcard b{font-size:13px}
.qcard .mini{margin-top:auto}
.bullet{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.bullet:last-child{border-bottom:0}
.bullet .n{width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:10.5px;font-weight:750;flex:none}
.card.dark .bullet{border-color:rgba(255,255,255,.08)}
.card.dark .bullet .n{background:rgba(255,255,255,.1)}
.alertline{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--amb-bg);color:#6b4307;font-size:12px}
.alertline b{color:#4a2e04}

/* ---------- lists / forms ---------- */
.listrow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line2)}
.listrow:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:750;font-size:11.5px;letter-spacing:.04em;flex:none;color:var(--ink2)}
.av.dark{background:var(--dark);color:#fff}
.av.xl{width:58px;height:58px;border-radius:18px;font-size:17px}
.person{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;text-align:left;transition:background .12s}
.person:hover{background:var(--soft)}
.person.active{background:var(--dark);color:#fff}
.person.active .mini{color:#a9abb0}
.person.active .av{background:#2a2c30;color:#fff}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.input,.field input,.field select,.field textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:#fff;outline:0;transition:border .15s}
.field textarea{height:auto;min-height:78px;padding:10px 11px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--ink)}
.search{position:relative}
.search input{padding-left:34px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;white-space:nowrap;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:#55575c;background:#fff}
.chip.active{background:var(--dark);border-color:var(--dark);color:#fff}
.check{display:flex;gap:11px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .box{width:20px;height:20px;border-radius:7px;border:1.5px solid #c9cac6;display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s;color:#fff}
.check .box .ic{width:13px;height:13px;stroke-width:2.6;opacity:0}
.check input:checked+.box{background:var(--dark);border-color:var(--dark)}
.check input:checked+.box .ic{opacity:1}
.check input:checked~div b{color:var(--muted);text-decoration:line-through}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv>div{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.kv .v{font-weight:650;font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.progress{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.progress>div{height:100%;background:var(--dark);border-radius:9px}
.card.dark .progress{background:rgba(255,255,255,.12)}
.card.dark .progress>div{background:#fff}

/* ---------- tasks board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:#ecece9;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col .colh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.task{background:#fff;border-radius:12px;padding:11px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.task .tt{display:flex;gap:9px;align-items:flex-start}
.task.done{opacity:.55}
.task.done .ttl{text-decoration:line-through}
.task .ttl{font-weight:620;font-size:12.5px;line-height:1.35}
.task .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid #c9cac6;display:grid;place-items:center;flex:none;color:#fff}
.tick.on{background:var(--dark);border-color:var(--dark)}
.tick .ic{width:12px;height:12px;stroke-width:2.6}

/* ---------- merch ---------- */
.need{display:flex;align-items:center;gap:18px}
.secrow{display:grid;grid-template-columns:90px repeat(4,minmax(0,1fr));gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.secrow:last-child{border-bottom:0}
.secrow.h{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 0 8px}
.secrow>div:not(:first-child){text-align:right}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:38px;overflow:hidden;background:#fff}
.stepper button{width:36px;height:100%;font-size:16px;color:var(--ink2)}
.stepper button:hover{background:var(--soft)}
.stepper input{flex:1;border:0;outline:0;text-align:center;min-width:0;height:100%;font-weight:650}
.timeline{position:relative;height:30px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.timeline .tf{position:absolute;top:0;bottom:0;left:0;background:var(--dark);border-radius:9px}
.timeline .tf.over{background:var(--neg)}
.timeline .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--amb)}

/* ---------- calendar ---------- */

function genDay(d){
  if(!isOpen(d))return {e:[0,0,0],u:[0,0,0]};
  const s=iso(d);
  const season=1+.05*Math.sin(((d.getMonth()+d.getDate()/31)/12)*2*Math.PI);
  const boost=fixedOn(s).reduce((b,f)=>f[3]?b*f[3]:b,1);
  const hol=fixedOn(s).some(f=>f[2]==='h')?.55:1;
  const tot=26400*WDF[d.getDay()]*season*boost*hol*(1+(rnd(s)-.5)*.16);
  const sp=SPLIT.map((p,i)=>p*(1+(rnd(s+'s'+i)-.5)*.12));const st=sp.reduce((a,b)=>a+b);
  const e=sp.map(p=>Math.round(tot*p/st/10)*10);
  const price=[29.5,31.8,17.6];
  const u=e.map((v,i)=>Math.round(v/(price[i]*(1+(rnd(s+'u'+i)-.5)*.08))));
  return {e,u};
}
function day(d){const s=iso(d);const o=S.sales&&S.sales[s];return o?{e:o.e.map(Number),u:o.u.map(Number),manual:true}:genDay(d)}
function dayLY(d){const g=genDay(addDays(d,-364));const f=1/(1.035+rnd('ly'+iso(d))*.04);return {e:g.e.map(v=>Math.round(v*f)),u:g.u.map(v=>Math.round(v*f*1.01))}}
const hasData=d=>d<TODAY; /* la venta se vuelca día a día: hasta ayer */
const secVal=(x,sec,k)=>sec==='Tienda'?sum(x[k]):x[k][SECTIONS.indexOf(sec)];
function weekDays(start,sec='Tienda'){
  return Array.from({length:7},(_,i)=>{const d=addDays(start,i),x=day(d),p=day(addDays(d,-7)),ly=dayLY(d);
    return {d,closed:!isOpen(d),has:hasData(d),today:+d===+TODAY,e:secVal(x,sec,'e'),u:secVal(x,sec,'u'),pe:secVal(p,sec,'e'),pu:secVal(p,sec,'u'),le:secVal(ly,sec,'e'),lu:secVal(ly,sec,'u'),x,manual:x.manual}})
}
function monthToDate(ref,sec='Tienda'){
  const y=ref.getFullYear(),m=ref.getMonth(),n=new Date(y,m+1,0).getDate();const out=[];let ca=0,cl=0,ct=0;
  for(let i=1;i<=n;i++){const d=new Date(y,m,i);const a=secVal(day(d),sec,'e'),l=secVal(dayLY(d),sec,'e');cl+=l;if(d<=ref&&hasData(d)){ca+=a}ct+=l*1.045;out.push({d,a:d<=ref&&hasData(d)?ca:null,l:cl})}
  const obj=Math.round(ct/1000)*1000;return {series:out,actual:ca,ly:out.filter(o=>o.a!==null).slice(-1)[0]?.l||0,lyFull:cl,obj};
}

function sparkline(vals,w=96,h=30,stroke='#0e0f11',fill=true){
  const v=vals.filter(x=>x!==null&&x!==undefined);if(v.length<2)return '';
  const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1;
  const pts=v.map((x,i)=>[i/(v.length-1)*(w-4)+2,h-3-(x-mn)/r*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const id='g'+Math.round(rnd(d)*1e9);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="spark">${fill?`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${stroke}" stop-opacity=".16"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${pts[pts.length-1][0]} ${h} L${pts[0][0]} ${h}Z" fill="url(#${id})"/>`:''}<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.4" fill="${stroke}"/></svg>`;
}
function ring(p,size=96,stroke=9,col='#0e0f11',track='#efefec',inner=''){
  const r=(size-stroke)/2,c=2*Math.PI*r,o=c*(1-clamp(p,0,1));

}
function gauge(v,min,max,target,w=200){
  const h=w*.62,cx=w/2,cy=w*.52,r=w*.42,a=x=>Math.PI*(1-(clamp(x,min,max)-min)/(max-min));

  const [tx,ty]=pt(a(target),r+9),[tx2,ty2]=pt(a(target),r-9);

function gapPeriod(){if(S.gapBase==='l7'){const a=addDays(TODAY,-7);return {from:a,to:addDays(TODAY,-1),label:'Últimos 7 días'}}const m=addDays(monday(TODAY),-7);return {from:m,to:addDays(m,6),label:`Semana cerrada S${weekNo(m)}`}}
function gapCalc(sec='Tienda'){
  const P=gapPeriod();let e=0,le=0,u=0,lu=0;
  for(let d=new Date(P.from);d<=P.to;d=addDays(d,1)){const x=day(d),l=dayLY(d);e+=secVal(x,sec,'e');le+=secVal(l,sec,'e');u+=secVal(x,sec,'u');lu+=secVal(l,sec,'u')}
  const se=vsp(e,le),su=vsp(u,lu),v=S.visits?S.visits[sec]:null,hasV=v!==null&&v!==undefined&&v!==''&&isFinite(+v);
  return {P,se,su,visits:hasV?+v:null,gapE:hasV&&se!==null?se-(+v):null,gapU:hasV&&su!==null?su-(+v):null};
}

function weekCtx(){
  const cur=monday(TODAY);
  const start=S.week==='pasada'?addDays(cur,-7):S.week==='proxima'?addDays(cur,7):cur;
  return {start,end:addDays(start,6),future:S.week==='proxima',past:S.week==='pasada'};
}
function ticketKpis(seed){const r=rnd('t'+seed),r2=rnd('m'+seed);return {upt:2.36+r*.16,uptD:(r-.4)*4.2,tm:66.2+r2*4.6,tmD:(r2-.35)*5.4}}

     <div class="big num">${done.length?eur(e):'—'}</div>
     <div class="hstack wrap" style="gap:12px"><span class="delta ${cls(ev)}">${ic(ev>=0?'up':'down','sm')}${pct(ev)} vs año ant.</span><span class="delta ${cls(evw)}">${pct(evw)} vs sem. anterior</span></div>
     <div class="sub2"><div><span class="lbl">Días volcados</span><span class="metric s num">${done.length}<span class="muted" style="font-size:13px"> / ${days.filter(d=>!d.closed).length}</span></span></div>${W.past?'':`<div><span class="lbl">Para cerrar semana</span><span class="metric s num">${eur(Math.max(0,objW-e))}</span><span class="mini">vs referencia ficticia</span></div>`}</div></div>`;

  const sparkU=days.filter(d=>!d.closed).map(d=>W.future?d.lu:d.has?d.u:null);
  const kpis=`${hero}

  `<div class="row wrap" style="margin:22px 2px 12px"><div class="seg wk">${[['pasada','Semana pasada'],['actual','Semana actual'],['proxima','Semana próxima']].map(([v,l])=>`<button class="${S.week===v?'active':''}" onclick="setWeek('${v}')">${l}</button>`).join('')}</div><span class="mini hide-m">${W.future?'Planificación · sin venta realizada':'Venta volcada día a día · actualizada hasta '+dshort(addDays(TODAY,-1))}</span></div>
  <div class="grid g12">${kpis}</div>

   <div class="card s4">${gapBlock()}</div>
   <div class="card s4">${weightBlock(days,W)}</div>
  </div>
  <div class="sec"><h2>Store maps</h2><span class="mini">Lectura de la semana pasada</span></div>
  ${storeMaps()}
  <div class="sec"><h2>Departamentos</h2></div>
  <div class="qa">
   ${qcard('chart','Negocio','Venta por sección',"goto('negocio')")}
   ${qcard('users','Personas',`${S.people.length} fichas · ${S.people.filter(p=>p.state==='Baja').length} baja`,"goManage('personas')")}
   ${qcard('list','Seguimiento',`${S.tasks.filter(t=>!t.done).length} tareas abiertas`,'goTasks()')}
   ${qcard('truck','Mercancía','Previsión de camión','goMerch()')}
   ${qcard('cal','Calendario','Eventos y fechas clave',"goto('calendario')")}
  </div>`;

function miniBars(days,W){const ds=days.filter(d=>!d.closed);const v=ds.map(d=>W.future?d.lu:d.has?d.u:d.pu);const mx=Math.max(1,...v);return `<div class="mbars">${ds.map((d,i)=>`<div><i class="${W.future||d.has?'':'g'}" style="height:${Math.max(6,v[i]/mx*100)}%;${W.future?'background:#cfd0cc':''}"></i><span>${DL[d.d.getDay()]}</span></div>`).join('')}</div>`}
const qcard=(i,t,s,fn)=>`<button class="qcard" onclick="${fn}"><span class="qi">${ic(i)}</span><b>${t}</b><span class="mini">${s}</span></button>`;

function dailyChart(days,W){
  const isU=S.unit!=='€',key=isU?'u':'e',pk=isU?'pu':'pe',lk=isU?'lu':'le';
  const f=v=>isU?fmt(v):eurK(v).replace(' k€','k');
  const mx=Math.max(1,...days.map(d=>Math.max(d[key]||0,d[pk]||0,d[lk]||0)))*1.08;
  const cols=days.map((d,i)=>{
    const flags=fixedOn(iso(d.d)).filter(x=>x[2]!=='h');const hol=fixedOn(iso(d.d)).some(x=>x[2]==='h');
    const fl=flags.length?`<span class="flag" style="background:${flags[0][2]==='p'?'var(--pos)':'var(--neg)'}"></span>`:'';
    let bar,val='',dl='';
    if(d.closed){bar=`<div class="bar ghost" style="height:4px"></div>`;val='<span class="muted">Cerrado</span>'}
    else if(W.future){bar=`<div class="bar ly" style="height:${d[lk]/mx*100}%"></div>`;val=f(d[lk])}
    else if(d.has){const dv=vsp(d[key],d[pk]);bar=`<div class="bar prev" style="height:${d[pk]/mx*100}%"></div><div class="bar" style="height:${d[key]/mx*100}%;z-index:1"></div>`;val=f(d[key]);dl=`<span class="dl ${cls(dv||0)}">${dv===null?'nuevo':pct(dv)}</span>`}
    else {bar=`<div class="bar ${d.today?'today':'ghost'}" style="height:${d[pk]/mx*100}%"></div>`;val=`<span class="muted">${d.today?'Hoy':'Pend.'}</span>`}
    return `<div class="bcol ${S.day===i?'sel':''}" onclick="setDay(${i})" title="${DOW[d.d.getDay()]} ${dshort(d.d)}">${fl}${dl||'<span class="dl"></span>'}<span class="val num">${val}</span><div class="bwrap">${bar}</div><div class="dlab"><b>${DL[d.d.getDay()]}</b>${d.d.getDate()}${hol?'·F':''}</div></div>`}).join('');
  const sel=S.day!==null?days[S.day]:null;
  return `<div class="ch"><div class="t"><h3>Venta por día</h3><span class="mini">${W.future?'Referencia año anterior por día · fechas de impacto marcadas':'Barra = semana actual · contorno = semana anterior · % vs semana anterior'}</span></div><div class="seg sm">${['€','Uds.'].map(x=>`<button class="${S.unit===x?'active':''}" onclick="setUnit('${x}')">${x}</button>`).join('')}</div></div>
   <div class="bars">${cols}</div>
   <div class="legend" style="margin-top:10px">${W.future?'<span><i class="lg-box" style="background:#cfd0cc"></i>Año anterior</span>':'<span><i class="lg-box" style="background:var(--dark)"></i>Venta</span><span><i class="lg-box" style="border:1.5px dashed #c9cac7"></i>Semana anterior</span><span><i class="lg-box" style="background:repeating-linear-gradient(135deg,#ecece9 0 3px,#f6f6f4 3px 6px);border:1px solid #e1e1de"></i>Pendiente de volcar</span>'}<span><i class="dot" style="background:var(--pos)"></i>Impacto +</span><span><i class="dot" style="background:var(--neg)"></i>Impacto −</span></div>
   ${sel?selDay(sel,W):''}
   <button class="detail-toggle ${S.detailOpen?'open':''}" onclick="set('detailOpen',!S.detailOpen)"><span>Detalle diario · € y unidades</span>${ic('chev','sm')}</button>
   ${S.detailOpen?detailTable(days,W):''}`;
}

  const imp=fixedOn(iso(d.d));

  const show=!d.closed&&(W.future||d.has);
  return `<div class="fade" style="margin-top:12px;background:var(--soft);border-radius:14px;padding:12px 14px">
   <div class="row"><b style="text-transform:capitalize">${dlong(d.d)}</b><button class="linkbtn muted" onclick="setDay(null)">${ic('x','sm')}</button></div>
   ${imp.map(f=>`<div class="mini" style="margin-top:4px"><span class="dot" style="background:${f[2]==='p'?'var(--pos)':f[2]==='n'?'var(--neg)':'#9a9a96'};margin-right:5px"></span>${esc(f[1])} · orientativo</div>`).join('')}
   ${show?`<div class="grid g4" style="margin-top:10px;gap:8px">
     <div><div class="lbl">${W.future?'Año ant.':'Venta'}</div><div class="metric s num">${eur(W.future?d.le:d.e)}</div></div>
     <div><div class="lbl">Unidades</div><div class="metric s num">${fmt(W.future?d.lu:d.u)}</div></div>
     ${W.future?'':`<div><div class="lbl">vs sem. ant.</div><div class="metric s ${cls(d.e-d.pe)}">${pctN(vsp(d.e,d.pe))}</div></div><div><div class="lbl">vs año ant.</div><div class="metric s ${cls(d.e-d.le)}">${pctN(vsp(d.e,d.le))}</div></div>`}
    </div>
    <table class="t" style="margin-top:8px"><tr><th>Sección</th><th>€</th><th>Uds.</th><th>Peso</th></tr>${SECTIONS.map((s,i)=>`<tr><td>${s}</td><td>${eur(base.e[i])}</td><td>${fmt(base.u[i])}</td><td>${fmt(base.e[i]/sum(base.e)*100,0)} %</td></tr>`).join('')}</table>
    ${d.manual?'<div class="mini" style="margin-top:6px">Datos volcados manualmente vía STORE AI</div>':''}`
   :`<div class="mini" style="margin-top:6px">${d.closed?'Tienda cerrada'+(d.d.getDay()===0?' (domingo · ajustable en Calendario).':'.'):'Venta pendiente de volcar. Referencia semana anterior: '+eur(d.pe)+' · '+fmt(d.pu)+' uds.'}</div>`}
  </div>`;
}
function detailTable(days,W){
  const rows=days.filter(d=>!d.closed);
  const tE=sum(rows.map(d=>W.future?d.le:d.has?d.e:0)),tU=sum(rows.map(d=>W.future?d.lu:d.has?d.u:0)),tPE=sum(rows.filter(d=>d.has).map(d=>d.pe));
  return `<div class="fade" style="overflow-x:auto"><table class="t" style="margin-top:6px"><tr><th>Día</th><th>€</th><th>Uds.</th><th>${W.future?'Impacto':'vs sem. ant.'}</th><th class="hide-m">${W.future?'':'vs año ant.'}</th></tr>
   ${rows.map(d=>{const i=days.indexOf(d);const imp=fixedOn(iso(d.d)).filter(f=>f[2]!=='h');return `<tr class="click ${S.day===i?'sel':''}" onclick="setDay(${i})"><td><b>${DL[d.d.getDay()]} ${d.d.getDate()}</b></td>${W.future?`<td>${eur(d.le)}</td><td>${fmt(d.lu)}</td><td>${imp.length?`<span class="pill ${imp[0][2]==='p'?'pos':'neg'}">${esc(imp[0][1])}</span>`:'—'}</td><td class="hide-m"></td>`:d.has?`<td>${eur(d.e)}</td><td>${fmt(d.u)}</td><td class="${cls(d.e-d.pe)}">${pctN(vsp(d.e,d.pe))}</td><td class="hide-m ${cls(d.e-d.le)}">${pctN(vsp(d.e,d.le))}</td>`:`<td class="muted">—</td><td class="muted">—</td><td class="muted">${d.today?'Hoy':'Pendiente'}</td><td class="hide-m"></td>`}</tr>`}).join('')}
   <tr class="tot"><td>Total</td><td>${eur(tE)}</td><td>${fmt(tU)}</td><td class="${W.future?'':cls(tE-tPE)}">${W.future||!tPE?'':pct((tE/tPE-1)*100)}</td><td class="hide-m"></td></tr></table></div>`;
}
function monthBlock(){
  const ref=addDays(TODAY,-1),M=monthToDate(ref),ev=M.ly?(M.actual/M.ly-1)*100:0;
  const rest=Math.max(0,M.obj-M.actual),p=M.actual/M.obj;
  const name=MON[ref.getMonth()];
  return `<div class="ch"><div class="t"><h3 style="text-transform:capitalize">Venta ${name}</h3><span class="mini">Acumulado hasta ${dshort(ref)}</span></div><div class="seg sm"><button class="${S.monthView==='evolucion'?'active':''}" onclick="set('monthView','evolucion')">Evolución</button><button class="${S.monthView==='restante'?'active':''}" onclick="set('monthView','restante')">Restante</button></div></div>
  <div class="metric num" style="font-size:26px">${eur(M.actual)}</div>
  ${S.monthView==='evolucion'?`<div class="hstack" style="margin:2px 0 6px"><span class="delta ${cls(ev)}">${ic(ev>=0?'up':'down','sm')}${pct(ev)}</span><span class="mini">vs mismo periodo año anterior (${eurK(M.ly)})</span></div>${lineChart(M.series,null,320,128)}<div class="legend"><span><i class="lg-box" style="background:var(--dark)"></i>${name} ${ref.getFullYear()}</span><span><i class="lg-box" style="border:1.5px dashed #bdbeba"></i>Año anterior</span></div>`
  :`<div class="need" style="margin-top:12px">${ring(p,104,10,'#0e0f11','#efefec',`<div><div class="metric s num">${fmt(p*100,0)} %</div><div class="mini">del objetivo</div></div>`)}<div class="grow"><div class="lbl">Restante para objetivo</div><div class="metric num" style="margin:3px 0 8px">${eur(rest)}</div><div class="lbl">Objetivo mes (ficticio)</div><div class="small" style="font-weight:650">${eur(M.obj)}</div></div></div><div class="progress" style="margin-top:14px"><div style="width:${clamp(p*100,0,100)}%"></div></div><div class="row mini" style="margin-top:6px"><span>Superar ${name} año ant.: ${eurK(M.lyFull)}</span><span>${M.actual>=M.lyFull?'Superado':'Faltan '+eurK(M.lyFull-M.actual)}</span></div>`}`;
}
const ZONE={Tienda:[0,0],Mujer:[0,0],Hombre:[0,0],Kids:[0,0]};
function zoneBlock(days,W){
  const done=days.filter(d=>d.has&&!d.closed);
  const evo=i=>{if(W.future||!done.length)return null;const a=sum(done.map(d=>d.x.e[i])),l=sum(done.map(d=>dayLY(d.d).e[i]));return (a/l-1)*100};
  const zone=[3.4,2.6,1.9];
  const rows=SECTIONS.map((s,i)=>({s,t:evo(i),z:zone[i]}));
  const tt=W.future||!done.length?null:(sum(done.map(d=>d.e))/sum(done.map(d=>d.le))-1)*100;
  const mx=Math.max(8,...rows.map(r=>Math.abs(r.t||0)),...zone);
  return `<div class="ch"><div class="t"><h3>Tienda vs zona</h3><span class="mini">Evolución a.a. por sección · mismo periodo</span></div><span class="pill line">Zona Alicante</span></div>
   <div class="row" style="margin-bottom:6px"><div><div class="lbl">Tienda</div><div class="metric s ${cls(tt)}">${tt===null?'—':pct(tt)}</div></div><div style="text-align:right"><div class="lbl">Zona</div><div class="metric s muted">${pct(2.9)}</div></div><div style="text-align:right"><div class="lbl">Dif.</div><div class="metric s ${cls(tt-2.9)}">${tt===null?'—':pp(tt-2.9)}</div></div></div>
   ${rows.map(r=>`<div class="zrow"><span class="small" style="font-weight:600">${r.s}</span><div class="zbars"><div class="track"><div class="fill" style="width:${Math.abs(r.t||0)/mx*100}%;background:${(r.t||0)<0?'var(--neg)':'var(--dark)'}"></div></div><div class="track"><div class="fill z" style="width:${r.z/mx*100}%"></div></div></div><span class="small ${r.t===null?'muted':cls(r.t-r.z)}" style="text-align:right;font-weight:700">${r.t===null?'—':pp(r.t-r.z)}</span></div>`).join('')}
   <div class="legend" style="margin-top:8px"><span><i class="lg-box" style="background:var(--dark)"></i>Tienda</span><span><i class="lg-box" style="background:#bdbeba"></i>Zona (ficticio)</span></div>`;
}

function procItems(){return [['rrhh','Comunicación a RR. HH.','Confirmar comunicación por el canal correspondiente'],['docs','Documentación de la baja','Verificar con RR. HH. qué documentación aplica, si se ha enviado y revisado'],['team','Reorganización del equipo','Comprobar turnos y necesidades de la sección'],['cover','Cobertura de la baja','Confirmar contratación autorizada, reorganización o no aplicable'],['verify','Validación final','Revisar que no quedan gestiones abiertas']]}

function toggleProc(id,v){procState(S.people[S.person])[id]=v;save();render()}

/* ---------- Mercancía · previsión de camión ---------- */
function merchCalc(){
  const h=Math.max(0,hm(S.shiftEnd)-hm(S.shiftStart)),pr=+S.pickRate||550,er=+S.peelRate||135,pc=(+S.peelPct||0)/100;
  const secs=SECTIONS.map((n,i)=>{const u=Math.max(0,+S.pack[i]||0),pick=u/pr,peelU=Math.round(u*pc),peel=peelU/er;return {n,u,pick,peelU,peel,tot:pick+peel,ppl:h?(pick+peel)/h:0,hang:Math.max(0,+S.hang[i]||0)}});
  const pack=sum(secs.map(s=>s.u)),hang=sum(secs.map(s=>s.hang)),pick=sum(secs.map(s=>s.pick)),peel=sum(secs.map(s=>s.peel)),tot=pick+peel;
  const need=h?Math.ceil(tot/h-1e-9):0,staff=+S.staff||0,end=staff?hm(S.shiftStart)+tot/staff:null;
  return {h,secs,pack,hang,pick,peel,tot,need,staff,end,peelU:sum(secs.map(s=>s.peelU)),pr,er};
}
function stepper(id,val,step=1){return `<div class="stepper"><button onclick="bump('${id}',-${step})" aria-label="Menos">−</button><input id="${id}" inputmode="numeric" value="${esc(val)}" onchange="fieldSet('${id}',this.value)"><button onclick="bump('${id}',${step})" aria-label="Más">+</button></div>`}
function bump(id,d){const el=$(id);fieldSet(id,Math.max(0,(+el.value||0)+d))}
function fieldSet(id,v){
  if(id.startsWith('pack'))S.pack[+id.slice(4)]=Math.max(0,+v||0);
  else if(id.startsWith('hang'))S.hang[+id.slice(4)]=Math.max(0,+v||0);
  else if(['staff','pickRate','peelRate','peelPct'].includes(id))S[id]=Math.max(0,+v||0);
  else S[id]=v;
  save();render();
}

/* ===================== CALENDARIO ===================== */
const EVTYPES=['Evento','Reunión','Mercancía','Personas','Festivo','Impacto +','Impacto −'];
function marksOn(s){
  const fx=fixedOn(s).map(f=>({title:f[1],k:f[2],fixed:true}));
  const ev=S.events.filter(e=>e.date===s).map(e=>({title:e.title,k:e.type==='Festivo'?'h':e.type==='Impacto +'?'p':e.type==='Impacto −'?'n':'e',id:e.id,type:e.type}));
  const ts=S.tasks.filter(t=>t.date===s&&!t.done).map(t=>({title:t.text,k:'t',task:true}));
  return {all:[...fx,...ev],tasks:ts,p:[...fx,...ev].some(x=>x.k==='p'),n:[...fx,...ev].some(x=>x.k==='n'),h:[...fx,...ev].some(x=>x.k==='h')};
}
function calendario(){
  const v=S.calendarView,d=parse(S.calendarDate);
  let title=v==='Día'?dlong(d):v==='Semana'?`${dshort(monday(d))} – ${dshort(addDays(monday(d),6))} · S${weekNo(d)}`:v==='Mes'?`${MON[d.getMonth()]} ${d.getFullYear()}`:String(d.getFullYear());
  return pageHead('Calendario','Eventos, festivos y fechas con impacto en venta')+
  `<div class="row wrap" style="margin-bottom:14px"><div class="seg">${['Día','Semana','Mes','Año'].map(x=>`<button class="${v===x?'active':''}" onclick="set('calendarView','${x}')">${x}</button>`).join('')}</div>
   <div class="hstack"><button class="iconbtn" style="border:1px solid var(--line);background:#fff" onclick="calMove(-1)" aria-label="Anterior">${ic('left','sm')}</button><b style="min-width:150px;text-align:center;text-transform:capitalize;font-size:14px">${title}</b><button class="iconbtn" style="border:1px solid var(--line);background:#fff" onclick="calMove(1)" aria-label="Siguiente">${ic('right','sm')}</button><button class="btn sm" onclick="calToday()">Hoy</button></div></div>
  <div class="grid g12"><div class="${v==='Año'||v==='Semana'?'s12':'s8'}">${v==='Mes'?calMonth(d):v==='Semana'?calWeek(d):v==='Día'?calDay(d):calYear(d)}</div>
  ${v==='Año'||v==='Semana'?'':`<div class="s4" style="display:flex;flex-direction:column;gap:14px">${agendaPanel(d)}${sundayCard()}</div>`}</div>
  ${v==='Año'||v==='Semana'?`<div class="grid g12" style="margin-top:14px"><div class="s6">${keyDates(v==='Año'?new Date(d.getFullYear(),0,1):monday(d),v==='Año'?366:21)}</div><div class="s6" style="display:flex;flex-direction:column;gap:14px">${agendaPanel(d)}${sundayCard()}</div></div>`:''}
  <div class="legend" style="margin-top:14px"><span><i class="lg-box" style="background:var(--pos-bg);border:1px solid #bfe3cd"></i>Venta significativamente mayor</span><span><i class="lg-box" style="background:var(--neg-bg);border:1px solid #f5c4bf"></i>Venta menor / afectación</span><span><i class="lg-box" style="background:#e6e6e3"></i>Festivo</span><span><i class="lg-box" style="background:var(--dark)"></i>Evento</span><span>Fechas orientativas: verificar calendario oficial y AQNE</span></div>`;
}
function cellClass(s){const m=marksOn(s);return m.n?'hn':m.p?'hp':m.h?'hol':''}
function calMonth(d){
  const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=monday(first);
  const cells=Array.from({length:42},(_,i)=>addDays(start,i));const rows=cells[35].getMonth()!==m?35:42;
  return `<div class="card" style="padding:12px"><div class="cal">${['L','M','X','J','V','S','D'].map(x=>`<div class="wd">${x}</div>`).join('')}
  ${cells.slice(0,rows).map(c=>{const s=iso(c),M=marksOn(s),out=c.getMonth()!==m;
   return `<button class="cday ${out?'out':''} ${cellClass(s)} ${+c===+TODAY?'today':''} ${s===S.calendarDate?'sel':''}" onclick="pickDate('${s}')"><span class="dn">${c.getDate()}</span>${c.getDay()===0&&!out?(isOpen(c)?'<span class="tag e" style="background:#3a3c41">Abierto</span>':'<span class="mini" style="font-size:9px">Cerrado</span>'):''}${M.all.slice(0,2).map(x=>`<span class="tag ${x.k}">${esc(x.title)}</span>`).join('')}${M.all.length>2?`<span class="mini">+${M.all.length-2}</span>`:''}<span class="dots">${M.all.map(x=>`<i class="dot" style="width:5px;height:5px;background:${x.k==='p'?'var(--pos)':x.k==='n'?'var(--neg)':x.k==='h'?'#9a9a96':'var(--ink)'}"></i>`).slice(0,4).join('')}${M.tasks.length?'<i class="dot" style="width:5px;height:5px;background:var(--amb)"></i>':''}</span></button>`}).join('')}</div></div>`;
}
function calWeek(d){

   return `<div class="wkd ${+c===+TODAY?'today':''} ${cellClass(s)}" onclick="pickDate('${s}')" style="cursor:pointer"><div class="wh"><span class="lbl">${DL[c.getDay()]}</span><b>${c.getDate()}</b></div><div class="evs">
    ${!isOpen(c)?'<span class="mini">Cerrado</span>':has?`<div class="small num"><b>${eurK(e)}</b> <span class="delta ${cls(e-(pe||0))}">${pctN(vsp(e,pe))}</span></div>`:`<div class="mini">Ref. sem. ant. ${eurK(pe)}</div>`}

function aiReply(q){
  const l=q.toLowerCase(),C=merchCalc();
  const who=S.people.find(p=>l.includes(p.name.toLowerCase().split(' ')[0])||l.includes(p.id));
  if(who&&/(n[uú]mero|empleado|n\.?º)/.test(l))return `${who.name} · Nº de empleado ${who.id}. ${who.role}, ${who.section}. Horario habitual: ${who.schedule}. ${who.reduced&&who.reduced!=='No'?'Reducción de jornada: '+who.reduced+'.':''} (Datos ficticios.)`;
  const hrs=l.match(/(\d+[.,]?\d*)\s*h(?:oras?)?\s*(m[aá]s|extra|complementari)/);
  if(who&&hrs){const t={id:Date.now(),text:`Pasar ${hrs[1]} h complementarias · ${who.name.split(' ')[0]}`,owner:'Dirección',date:rel(1),priority:'Media',cat:'Horas compl.',done:false};S.tasks.push(t);return `Anotado. He creado la tarea «${t.text}» en Gestión › Seguimiento, con fecha ${dshort(parse(t.date))}. Recuerda tramitarlas en la herramienta correspondiente.`}
  if(who&&/de baja/.test(l)){who.state='Baja';who.since=iso(TODAY);return `Registrado: ${who.name} figura de baja desde hoy (ejemplo). He abierto las comprobaciones de documentación y cobertura en su ficha; aparecerán en Inicio hasta cerrarse. No doy por realizado ningún trámite sin tu confirmación.`}
  if(/rrhh|rr\. ?hh|recursos humanos/.test(l)&&/llamar|hablar|contactar/.test(l)){S.tasks.push({id:Date.now(),text:q.charAt(0).toUpperCase()+q.slice(1),owner:'Dirección',date:rel(0),priority:'Alta',cat:'RR. HH.',done:false});return 'Tarea creada en Seguimiento › RR. HH. con prioridad alta para hoy.'}
  if(/mercanc|cami[oó]n|paqueter|confecci/.test(l))return `Previsión del ${dshort(parse(S.merchDate))}: ${fmt(C.pack)} uds. de paquetería (Mujer ${fmt(C.secs[0].u)}, Hombre ${fmt(C.secs[1].u)}, Kids ${fmt(C.secs[2].u)}) y ${fmt(C.hang)} de confección (empresa externa, sin trabajo de tienda).\n\nPicking ${fmt(C.pick,1)} h + pelado y perchado ${fmt(C.peel,1)} h (${fmt(C.peelU)} uds., ${S.peelPct} %) = ${fmt(C.tot,1)} h.\nCon un turno de ${S.shiftStart} a ${S.shiftEnd} (${fmt(C.h,1)} h) necesitas ${C.need} personas. Tienes ${C.staff}: ${C.staff>=C.need?'cubierto':'faltan '+(C.need-C.staff)}. Con ${C.staff} personas terminaríais a las ${C.end===null?'—':hhmm(C.end)}.`;
  if(/baja|documentaci/.test(l)||(who&&who.state==='Baja')){const p=(who&&who.state==='Baja')?who:S.people.find(x=>x.state==='Baja');if(!p)return 'No hay bajas activas registradas.';const st=procState(p),n=procItems().filter(x=>!st[x[0]]);const f=p.name.split(' ')[0];return n.length?`Baja de ${f} (ejemplo ficticio): quedan ${n.length} comprobaciones: ${n.map(x=>x[1].toLowerCase()).join(', ')}. Verifícalas con RR. HH.; no puedo confirmar trámites automáticamente.`:`La baja de ${f} tiene todas las comprobaciones confirmadas.`}
  if(/pendien|tarea|qu[eé] tengo/.test(l)){const r=aiRequests(),t=S.tasks.filter(t=>!t.done);return `Solicitudes que necesito de ti (${r.length}):\n${r.map(x=>'• '+x.title).join('\n')||'• Ninguna'}\n\nTareas abiertas en Seguimiento (${t.length}):\n${t.slice(0,6).map(x=>'• '+x.text+' · '+(x.date===iso(TODAY)?'hoy':dshort(parse(x.date)))).join('\n')}`}
  if(/semana que viene|pr[oó]xima semana|aqne|marcar/.test(l)){const st=addDays(monday(TODAY),7);const list=[];for(let i=0;i<7;i++){const s=iso(addDays(st,i));marksOn(s).all.forEach(x=>list.push(`• ${DL[addDays(st,i).getDay()]} ${addDays(st,i).getDate()}: ${x.title}`))}return `Semana ${weekNo(st)} (${dshort(st)} – ${dshort(addDays(st,6))}):\n${list.join('\n')||'• Sin eventos ni fechas de impacto marcadas'}\n\n¿Quieres que marque algo más? Pásame el AQNE y señalo los días con impacto significativo.`}
  if(/cierre|semana pasada|datos de venta/.test(l))return 'Para el cierre comercial de la semana pasada envíame las capturas de la app de negocio: venta neta y unidades por día y sección, Uds./ticket, ticket medio y GAP NETO. Te mostraré lo que leo para que lo confirmes; no marcaré el cierre como registrado hasta entonces. En esta demo puedes volcar cada día en «Volcar venta del día».';
  if(/store ?maps/.test(l))return 'Perfecto. Del Store maps haré una lectura de la semana pasada: cómo cerró, productividad (rango sano ≈ 8,5) y los puntos de la última página para dirección. Tendré en cuenta que puede incluir problemas ya resueltos. En esta demo no puedo leer el PDF todavía.';
  if(/gap/.test(l)){const g=gapCalc('Tienda');return g.gapE===null?'Para calcular el GAP NETO necesito las visitas % vs A-1 de la tienda. Fórmula: % venta NETA vs A-1 − % visitas vs A-1.':`GAP NETO (${g.P.label}): GAP € ${pp(g.gapE)} (venta neta ${pctN(g.se)} − visitas ${pct(g.visits)}) · GAP uds. ${pp(g.gapU)} (unidades ${pctN(g.su)}). Sin GAP de zona. Por sección solo lo calculo si me pasas sus visitas. Datos ficticios.`}

}

  const badge=aiRequests().length;
  $('sidenav').innerHTML=SIDE.map(([id,i,l])=>`<button class="navbtn ${S.page===id?'active':''}" onclick="goto('${id}')">${ic(i)}${l}${id==='ai'&&badge?`<span class="badge pill ${S.page===id?'':'amb'}" style="height:19px">${badge}</span>`:''}</button>`).join('');
  $('tabbar').innerHTML=TABS.map(([id,i,l])=>id==='ai'?`<button class="tb-ai ${S.page===id?'active':''}" onclick="goto('ai')"><span class="aib">${ic(i)}</span>${l}${badge?`<span class="badge">${badge}</span>`:''}</button>`:`<button class="${S.page===id?'active':''}" onclick="goto('${id}')">${ic(i)}${l}</button>`).join('');
}
function goto(p){S.page=p;save();render();window.scrollTo(0,0)}
function goMerch(){goManage('mercancia')}
function goTasks(){goManage('seguimiento')}
function goPerson(i,tab='ficha'){S.page='gestion';S.manage='personas';S.person=i;S.personTab=tab;S.personEdit=false;save();render();if(innerWidth<900)setTimeout(()=>$('ficha')?.scrollIntoView({behavior:'smooth',block:'start'}),40);else window.scrollTo(0,0)}
function resetDemo(){if(confirm('¿Restablecer todos los datos ficticios y cambios locales de esta demo?')){localStorage.removeItem(KEY);location.reload()}}
function render(){
  nav();
  const pages={inicio:home,negocio:negocio,gestion:gestion,calendario:calendario,ai:ai};
  $('app').innerHTML=(pages[S.page]||home)()+`<div class="footer-note"><span>STORE MANAGER 1.0 · Demo local · Datos ficticios · Sin integración con Zara · Se guarda solo en este dispositivo</span><button class="btn sm" onclick="resetDemo()">${ic('refresh','sm')} Restablecer demo</button></div>`;
  if(S.page==='ai')scrollChat();
}
if(!S.chat.length)S.chat=[{who:'ai',text:welcomeLine()}];
render();


</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
