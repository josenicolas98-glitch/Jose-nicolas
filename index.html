  return `<div class="card" id="sundays"><div class="ch"><div class="t"><h3>Aperturas en domingo</h3><span class="mini">Según la época del año</span></div>${ic('clock')}</div>
   <div class="row"><span class="small" style="font-weight:600">Domingos por defecto</span><div class="seg sm"><button class="${!S.sundayOpen?'active':''}" onclick="set('sundayOpen',false)">Cerrados</button><button class="${S.sundayOpen?'active':''}" onclick="set('sundayOpen',true)">Abiertos</button></div></div>
   <div class="lbl" style="margin:14px 0 6px">Excepciones por fecha</div>
   ${ov.map(([k,v])=>{const d=parse(k);return `<div class="listrow" style="padding:7px 2px"><div class="grow"><b class="small">Domingo ${d.getDate()} ${MS[d.getMonth()]} ${d.getFullYear()}</b></div><span class="pill ${v?'pos':''}">${v?'Abierto':'Cerrado'}</span><button class="iconbtn" style="width:26px;height:26px" title="Quitar excepción" onclick="setSunday('${k}','def')">${ic('x','sm')}</button></div>`}).join('')||'<div class="wfree">Sin excepciones.</div>'}
   <div class="hstack" style="margin-top:10px;gap:6px"><input type="date" class="input" id="sunDate" style="flex:1"><button class="btn sm" onclick="addSunday(true)">Abrir</button><button class="btn sm" onclick="addSunday(false)">Cerrar</button></div></div>`;
}
function setSunday(s,k){S.sundayOv=S.sundayOv||{};if(k==='def')delete S.sundayOv[s];else S.sundayOv[s]=k==='open';save();render()}
function addSunday(open){const v=$('sunDate').value;if(!v)return toast('Elige una fecha');if(parse(v).getDay()!==0)return toast('La fecha elegida no es domingo');setSunday(v,open?'open':'closed');toast('Domingo '+dshort(parse(v))+(open?' abierto':' cerrado'))}
function keyDates(from,span){
  const start=from<TODAY?TODAY:from,end=addDays(from,span);
  const L=[...FIXED.map(f=>({date:f[0],title:f[1],type:'Festivo',fixed:true})),...S.events.map(e=>({date:e.date,title:e.title,type:e.type,e}))].filter(x=>{const d=parse(x.date);return d>=start&&d<end}).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
  return `<div class="card"><div class="ch"><div class="t"><h3>Próximas fechas</h3><span class="mini">Eventos y festivos</span></div></div>${L.map(x=>{const d=parse(x.date);return `<button class="keyd" style="width:100%;text-align:left" onclick="S.calendarView='Día';pickDate('${x.date}')"><div class="dd"><b>${d.getDate()}</b><span>${MS[d.getMonth()]}</span></div><span class="dot" style="background:${dotOf(x.type)}"></span><div class="grow"><b class="small">${esc(x.title)}</b><div class="mini">${DOW[d.getDay()]} · ${esc(x.type||'Evento')}${x.e&&x.e.end&&x.e.end!==x.e.date?' · '+rangeTxt(x.e):''}${x.fixed?' · orientativo':''}</div></div></button>`}).join('')||'<div class="empty">Sin fechas en este periodo.</div>'}</div>`;
}
function calMove(n){const d=parse(S.calendarDate),v=S.calendarView;let x=v==='Día'?addDays(d,n):v==='Semana'?addDays(d,7*n):v==='Mes'?new Date(d.getFullYear(),d.getMonth()+n,1):new Date(d.getFullYear()+n,d.getMonth(),1);S.calendarDate=iso(x);save();render()}
function calToday(){S.calendarDate=iso(TODAY);save();render()}
function pickDate(s){S.calendarDate=s;save();render()}
function openWeekCal(off){S.page='calendario';S.calendarView='Semana';S.calendarDate=iso(addDays(TODAY,off));save();render();window.scrollTo(0,0)}
function addEvent(){const t=$('eventTitle').value.trim();if(!t)return toast('Escribe el evento');const a=$('eventDate').value||S.calendarDate,b=$('eventEnd').value;
  S.events.push({id:Date.now(),title:cap(t),date:a,end:b&&b>a?b:null,time:$('eventTime').value||null,type:$('eventType').value});save();render();toast('Evento añadido')}
function deleteEvent(id){const e=S.events.find(x=>x.id===id);S.events=S.events.filter(e=>e.id!==id);save();render();if(e)toast('Eliminado: '+e.title)}

/* ===================== STORE AI ===================== */
const AI_SUGS=[['Qué tengo esta semana','¿Qué tengo esta semana?'],['Formación el 27','El día 27 tenemos una formación grupal con el equipo'],['Semana del 22','La semana del 22 tenemos una formación total tienda'],['Qué me falta','¿Qué me falta por cargar?'],['Deshacer','Deshaz lo último']];
function ai(){
  const r=aiRequests(),st=monday(TODAY),wev=weekEvents(st);
  return `<div class="ai-page">`+pageHead('STORE AI','Tu asistente de dirección · Maisonnave 076')+
  `<div class="grid g12"><div class="card s7 chat">
    <div class="chat-h"><div class="hstack"><div class="ai-av dark">${ic('spark')}</div><div><b class="chat-n">STORE AI</b><div class="mini">Entiende fechas y apunta en tu calendario · funciona en el dispositivo</div></div></div><button class="btn sm ghost" onclick="clearChat()">${ic('refresh','sm')} Nueva</button></div>
    <div class="chatlog" id="chatlog">${S.chat.map((x,i)=>msgHTML(x,i)).join('')}</div>
    <div class="sugs">${AI_SUGS.map(([l,q])=>`<button class="chip" onclick="aiAsk('${q.replace(/'/g,"\\'")}')">${l}</button>`).join('')}</div>
    <form class="composer" onsubmit="sendChat(event)"><input type="text" id="chatmsg" placeholder="Ej.: «el viernes inventario»" autocomplete="off" enterkeyhint="send"><button class="iconbtn dark" aria-label="Enviar">${ic('send','sm')}</button></form>
   </div>
   <div class="s5 calside">
    <div class="card"><div class="ch"><div class="t"><h3>Esta semana</h3><span class="mini">${dshort(st)} – ${dshort(addDays(st,6))}</span></div><button class="linkbtn" onclick="goto('inicio')">Ver ${ic('right','sm')}</button></div>
     ${wev.map(e=>`<div class="listrow"><div class="evd"><b>${parse(e.date).getDate()}</b><span>${MS[parse(e.date).getMonth()]}</span></div><div class="grow"><b class="small">${esc(e.title)}</b><div class="mini">${e.end&&e.end!==e.date?rangeTxt(e):DOW[parse(e.date).getDay()]}${evTime(e)?' · '+evTime(e):''}</div></div></div>`).join('')||'<div class="wfree">Semana despejada.</div>'}</div>
    <div class="card"><div class="ch"><div class="t"><h3>Lo que necesito de ti</h3><span class="mini">Para tener la tienda al día</span></div><span class="pill ${r.length?'dark':''}">${r.length}</span></div>
     ${r.map(x=>`<div class="listrow"><span class="av">${ic(x.icon,'sm')}</span><button class="grow" style="text-align:left" onclick="${x.act}"><b class="small">${esc(x.title)}</b><div class="mini">${esc(x.sub)}</div></button>${x.keep?'':`<button class="iconbtn" style="width:28px;height:28px" title="Marcar resuelta" onclick="resolveReq('${x.key}')">${ic('check','sm')}</button>`}</div>`).join('')||'<div class="wfree">Nada pendiente.</div>'}</div>
   </div></div></div>`;
}
function evCard(e,m,i){
  const d=parse(e.date),multi=e.end&&e.end!==e.date;
  return `<div class="evcard ${m.undone?'undone':''} ${m.op&&m.op.kind==='del'?'del':''}"><div class="evd"><b>${d.getDate()}</b><span>${MS[d.getMonth()]}</span></div>
   <div class="grow"><b class="small">${esc(e.title)}</b><div class="mini">${multi?`${rangeTxt(e)} · ${evDays(e)} días`:cap(DOW[d.getDay()])}${evTime(e)?' · '+evTime(e):''} · ${esc(e.type||'Evento')}</div></div>
   ${m.undone?'<span class="mini">Deshecho</span>':`<div class="evc-a">${m.op.kind!=='del'?`<button class="linkbtn" onclick="openEvent(${e.id})">Ver</button>`:''}<button class="linkbtn muted" onclick="aiUndo(${i})">Deshacer</button></div>`}</div>`;
}
function msgHTML(x,i){
  const card=x.op&&x.op.ev?evCard(x.op.kind==='move'?(S.events.find(e=>e.id===x.op.ev.id)||x.op.ev):x.op.ev,x,i):'';
  return `<div class="msgwrap ${x.who}">${x.who==='ai'?`<span class="ai-dot">${ic('spark','sm')}</span>`:''}<div class="msgcol"><div class="msg ${x.who}">${esc(x.text)}</div>${card}</div></div>`;
}
function clearChat(){S.chat=[{who:'ai',text:welcomeLine()}];save();render()}
function scrollChat(){const el=$('chatlog');if(el)el.scrollTop=el.scrollHeight}
function aiAsk(q){S.page='ai';S.chat.push({who:'me',text:q});S.chat.push(aiCore(q));save();render();window.scrollTo(0,0);setTimeout(scrollChat,30)}
function sendChat(e){e.preventDefault();const v=$('chatmsg').value.trim();if(v)aiAsk(v)}

/* ---- motor de respuestas ---- */
const pick=a=>a[S.chat.length%a.length];
const lowFirst=t=>/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]/.test(t)?t.charAt(0).toLowerCase()+t.slice(1):t;
function whenTxt(e){const d=parse(e.date);if(e.end&&e.end!==e.date){const b=parse(e.end);return `del ${dlong(d)} al ${dlong(b)}`}
  const diff=Math.round((d-TODAY)/864e5);const base=diff===0?'hoy':diff===1?'mañana':diff===2?'pasado mañana':`el ${dlong(d)}`;return base+(evTime(e)?` a las ${e.time}${e.timeEnd?' hasta las '+e.timeEnd:''}`:'')}
function hintFor(e){const d=parse(e.date),diff=Math.round((d-TODAY)/864e5),st=monday(TODAY);
  const same=eventsOn(e.date).filter(x=>x.id!==e.id&&!(x.end&&x.end!==x.date));
  if(same.length)return ` Ojo, ese día también tienes ${same.map(x=>lowFirst(x.title)).join(' y ')}.`;
  if(diff<0)return ' Te lo dejo registrado aunque ya ha pasado.';
  if(d<=addDays(st,6))return ' Ya lo tienes en tu semana, en Inicio.';
  if(diff<=31)return ` Faltan ${diff} días; lo verás en el calendario del mes.`;
  return ' Lo tienes en el calendario.';}
function listTxt(a,b,label){
  const L=S.events.filter(e=>e.date<=b&&evEnd(e)>=a).sort((x,y)=>x.date.localeCompare(y.date)||(x.time||'99').localeCompare(y.time||'99'));
  const trucks=[];for(let d=parse(a);iso(d)<=b;d=addDays(d,1))if(truckOn(d))trucks.push(d);
  const hol=FIXED.filter(f=>f[0]>=a&&f[0]<=b);
  if(!L.length&&!trucks.length&&!hol.length)return pick([`${cap(label)} no tienes nada apuntado. ¿Quieres que te apunte algo?`,`Nada en la agenda ${label}: semana tranquila. Si me dices qué hay, lo apunto.`]);
  const lines=L.map(e=>{const d=parse(e.date);return `• ${e.end&&e.end!==e.date?rangeTxt(e):DOW[d.getDay()].slice(0,3)+' '+d.getDate()}${e.time?' · '+e.time:''} — ${e.title}`});
  hol.forEach(f=>lines.push(`• ${DOW[parse(f[0]).getDay()].slice(0,3)} ${parse(f[0]).getDate()} — ${f[1]} (festivo)`));
  if(trucks.length)lines.push(`• Camión: ${trucks.map(d=>DOW[d.getDay()].slice(0,3).toLowerCase()+' '+d.getDate()).join(', ')} (${S.shiftStart}–${S.shiftEnd})`);
  const n=L.length+hol.length;
  return `${cap(label)} tienes ${n} ${n===1?'cosa':'cosas'}${trucks.length?' y camión':''}:\n${lines.join('\n')}`;
}
function missingTxt(){const m=[];
  if(!S.report)m.push('el análisis de tienda de la semana (Negocio › Importar datos)');
  if(!(S.truckDays||[]).length)m.push('los días de camión (Gestión › Mercancía)');
  if(!S.people.length)m.push('las fichas del equipo (Gestión › Personas)');
  if(!(S.todos||[]).some(t=>t.month===monthKey(TODAY)))m.push(`los pendientes de ${MON[TODAY.getMonth()]} (Calendario)`);
  return m.length?`Para tenerlo todo al día me falta:\n${m.map(x=>'• '+x).join('\n')}\nSin prisa, vamos poco a poco.`:'Lo tengo todo. ¡Buen trabajo!'}
function aiCore(q){
  const it=NLP.intent(q,TODAY),out=(text,op)=>{const m={who:'ai',text};if(op){m.op=op}return m};
  if(it.kind==='hello')return out(pick([`¡Hola! ${welcomeLine().split('. ').slice(1).join('. ')}`,`¡Buenas! ¿Qué apuntamos hoy?`]));
  if(it.kind==='thanks')return out(pick(['¡A ti! Aquí estoy para lo que necesites.','De nada. Si surge algo más, me lo dices y lo apunto.','Perfecto. Seguimos.']));
  if(it.kind==='undo'){for(let i=S.chat.length-1;i>=0;i--){const m=S.chat[i];if(m.op&&!m.undone){undoOp(m);return out(`Deshecho: ${m.op.kind==='add'?'he quitado':m.op.kind==='del'?'he recuperado':'he devuelto a su fecha'} «${m.op.ev.title}».`)}}return out('No tengo nada reciente que deshacer.')}
  if(it.kind==='add'){
    const x=it.x;let title=it.title;
    const dup=S.events.find(e=>e.date===x.date&&NLP.norm(e.title)===NLP.norm(title));
    if(dup)return out(`Eso ya lo tenía apuntado ${whenTxt(dup)}. Lo dejo como está.`);
    const ev={id:Date.now()+Math.floor(Math.random()*1000),date:x.date,end:x.end&&x.end!==x.date?x.end:null,time:x.time||null,timeEnd:x.timeEnd||null,title,type:it.type};
    S.events.push(ev);
    const t=lowFirst(title);
    const txt=ev.end?(x.week?pick([`Hecho. Bloqueo la semana del ${parse(ev.date).getDate()} al ${dshort(parse(ev.end))} para ${t}.`,`Genial, ${t} toda la semana: del lunes ${parse(ev.date).getDate()} al domingo ${dshort(parse(ev.end))}.`]):pick([`Apuntado: ${t} ${whenTxt(ev)} (${evDays(ev)} días).`,`Perfecto, ${t} ${whenTxt(ev)}.`]))
      :pick([`¡Apuntado! ${cap(t)} ${whenTxt(ev)}.`,`Hecho, ${t} queda ${whenTxt(ev)}.`,`Perfecto. Te dejo ${t} ${whenTxt(ev)}.`]);
    const m=out(txt+hintFor(ev),{kind:'add',ev:{...ev}});m.toast='Apuntado en el calendario';return m}
  if(it.kind==='list'){const x=it.x;let a,b,label;
    if(x.date&&x.end){a=x.date;b=x.end;label=x.week?(x.date===iso(monday(TODAY))?'esta semana':x.date===iso(addDays(monday(TODAY),7))?'la semana que viene':`la semana del ${dshort(parse(a))}`):x.scope==='month'?`en ${MON[parse(a).getMonth()]}`:`del ${dshort(parse(a))} al ${dshort(parse(b))}`}
    else if(x.date){a=b=x.date;const d=parse(a),df=Math.round((d-TODAY)/864e5);label=df===0?'hoy':df===1?'mañana':`el ${dlong(d)}`}
    else{a=iso(monday(TODAY));b=iso(addDays(monday(TODAY),6));label='esta semana'}
    return out(listTxt(a,b,label))}
  if(it.kind==='missing')return out(missingTxt());
  if(it.kind==='delete'){const r=NLP.matchEvents(S.events,it.rest,TODAY);
    if(!r.list.length)return out(pick(['No encuentro ningún evento así. ¿Me dices el día o el nombre exacto?','Mmm, no lo veo en el calendario. ¿Qué día era?']));
    if(r.list.length>1)return out(`Tengo ${r.list.length} que encajan:\n${r.list.slice(0,4).map(e=>`• ${dshort(parse(e.date))} — ${e.title}`).join('\n')}\n¿Cuál borro? Dímelo con el día.`);
    const e=r.list[0];S.events=S.events.filter(x=>x.id!==e.id);const m=out(pick([`Listo, he borrado ${lowFirst(e.title)} (${whenTxt(e)}).`,`Hecho: ${lowFirst(e.title)} fuera del calendario.`]),{kind:'del',ev:{...e}});m.toast='Evento eliminado';return m}
  if(it.kind==='move'){const r=NLP.matchEvents(S.events,it.src,TODAY);const dst=NLP.extract(it.dst||'',TODAY);
    if(!r.list.length)return out('No encuentro ese evento. ¿Me dices cómo se llama o qué día es?');
    if(r.list.length>1)return out(`Hay ${r.list.length} parecidos:\n${r.list.slice(0,4).map(e=>`• ${dshort(parse(e.date))} — ${e.title}`).join('\n')}\n¿Cuál muevo?`);
    if(!dst.date&&!dst.time)return out(`¿A qué día muevo ${lowFirst(r.list[0].title)}?`);
    const e=r.list[0],prev={date:e.date,end:e.end||null,time:e.time||null,timeEnd:e.timeEnd||null};
    if(dst.date){const len=evDays(e)-1;e.date=dst.date;e.end=dst.end&&dst.end!==dst.date?dst.end:(len?iso(addDays(parse(dst.date),len)):null)}
    if(dst.time){e.time=dst.time;e.timeEnd=dst.timeEnd||null}
    const m=out(pick([`Movido. ${cap(lowFirst(e.title))} pasa ${('a '+whenTxt(e)).replace(/^a el /,'al ')}.`,`Hecho, ${lowFirst(e.title)} ahora es ${whenTxt(e)}.`])+hintFor(e),{kind:'move',ev:{...e},prev});m.toast='Evento movido';return m}
  /* otras consultas */
  const l=NLP.norm(q);
  const who=S.people.find(p=>l.includes(NLP.norm(p.name.split(' ')[0]))||l.includes(p.id));
  if(who&&/(numero|empleado|n º|nº)/.test(l))return out(`${who.name} · Nº de empleado ${who.id}. ${who.role}, ${who.section}.`);
  if(/camion|mercancia|paqueteria/.test(l)){const days=(S.truckDays||[]).map(i=>DOW[i].toLowerCase());const C=merchCalc();
    return out(days.length?`El camión llega los ${days.join(', ')} y el turno es de ${S.shiftStart} a ${S.shiftEnd}.${C.pack?` Para el próximo tengo ${fmt(C.pack)} uds de paquetería: necesitas ${C.need} personas.`:' Cuando tengas las unidades de paquetería, ponlas en Gestión › Mercancía y te calculo el equipo.'}`:`Aún no sé qué días llega el camión. Márcalos en Gestión › Mercancía y lo pongo en tu semana (turno ${S.shiftStart}–${S.shiftEnd}).`)}
  if(/gap|venta|negocio|como vamos|como va/.test(l)){if(!S.report)return out('Todavía no tengo el análisis de la semana. Impórtalo en Negocio y te digo cómo vamos frente a zona, la conversión y el GAP.');
    const t=lecturaTienda(S.report).replace(/<[^>]+>/g,'').replace(/\s*(auto|editada)\s*$/,'');return out(t||'Tengo el análisis, pero le faltan la venta y la zona para hacer la lectura.')}
  if(/pendien|tarea|que tengo que hacer/.test(l)){const r=aiRequests(),t=S.tasks.filter(t=>!t.done);
    return out(`${r.length?`Necesito de ti:\n${r.map(x=>'• '+x.title).join('\n')}`:'No necesito nada de ti ahora mismo.'}${t.length?`\n\nTareas abiertas:\n${t.slice(0,6).map(x=>'• '+x.text).join('\n')}`:''}`)}
  if(it.x&&it.x.date&&!it.title)return out(`¿Qué hay ${whenTxt({date:it.x.date,end:it.x.end,time:it.x.time})}? Dímelo y lo apunto.`);
  return out(pick(['No te he entendido del todo. Prueba con algo como «el día 27 tenemos formación con el equipo», «mueve la reunión al viernes» o «¿qué tengo esta semana?».','Perdona, no lo he pillado. Puedo apuntar, mover o borrar cosas del calendario y decirte qué tienes cualquier día.']));
}
function undoOp(m){const o=m.op;if(o.kind==='add')S.events=S.events.filter(e=>e.id!==o.ev.id);else if(o.kind==='del')S.events.push({...o.ev});else if(o.kind==='move'){const e=S.events.find(x=>x.id===o.ev.id);if(e)Object.assign(e,o.prev)}m.undone=true}
function aiUndo(i){const m=S.chat[i];if(!m||!m.op||m.undone)return;undoOp(m);save();render();toast('Deshecho')}

/* ===================== SHELL / NAVEGACIÓN ===================== */
const TABS=[['inicio','home','Inicio'],['negocio','chart','Negocio'],['ai','spark','STORE AI'],['gestion','brief','Gestión'],['calendario','cal','Calendario']];
const SIDE=[['inicio','home','Inicio'],['negocio','chart','Negocio'],['gestion','brief','Gestión'],['calendario','cal','Calendario'],['ai','spark','STORE AI']];
function pageHead(t,sub){return `<div class="ph"><div><div class="eyebrow">Zara · Alicante · Maisonnave 076</div><div class="h1">${t}</div><div class="lead">${sub}</div></div><div class="right"><span class="pill line">${ic('clock','sm')} ${dshort(TODAY)}</span></div></div>`}
function nav(){
  const badge=aiRequests().length;
  $('sidenav').innerHTML=SIDE.map(([id,i,l])=>`<button class="navbtn ${S.page===id?'active':''}" onclick="goto('${id}')">${ic(i)}${l}${id==='ai'&&badge?`<span class="badge pill ${S.page===id?'':'amb'}" style="height:19px">${badge}</span>`:''}</button>`).join('');
  $('tabbar').innerHTML=TABS.map(([id,i,l])=>id==='ai'?`<button class="tb-ai ${S.page===id?'active':''}" onclick="goto('ai')"><span class="aib">${ic(i)}</span>${l}${badge?`<span class="badge">${badge}</span>`:''}</button>`:`<button class="${S.page===id?'active':''}" onclick="goto('${id}')">${ic(i)}${l}</button>`).join('');
}
function goto(p){FLASH=null;S.page=p;save();render();window.scrollTo(0,0)}
function goMerch(){goManage('mercancia')}
function goTasks(){goManage('seguimiento')}
function goPerson(i,tab='ficha'){S.page='gestion';S.manage='personas';S.person=i;S.personTab=tab;S.personEdit=false;save();render();if(innerWidth<900)setTimeout(()=>$('ficha')?.scrollIntoView({behavior:'smooth',block:'start'}),40);else window.scrollTo(0,0)}
function resetData(){if(confirm('¿Restablecer los datos y cambios guardados en este dispositivo?')){localStorage.removeItem(KEY);location.reload()}}
function render(){
  nav();
  const pages={inicio:home,negocio:negocio,gestion:gestion,calendario:calendario,ai:ai};
  $('app').innerHTML=(pages[S.page]||home)()+`<div class="footer-note"><span class="fn-brand"><svg class="zwm" viewBox="${ZVB}"><path d="${ZPATH}"/></svg><span>STORE MANAGER · v1.0 · Maisonnave 076 · Alicante</span></span><button class="btn sm ghost" onclick="resetData()">${ic('refresh','sm')} Restablecer datos</button></div>`;
  if(S.page==='ai')scrollChat();
}
if(!S.chat.length)S.chat=[{who:'ai',text:welcomeLine()}];
render();


</script>
