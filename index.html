  if(!S.people.length)m.push('las fichas del equipo (Personas)');
  if(!(S.todos||[]).some(t=>t.month===monthKey(TODAY)))m.push(`los pendientes de ${MON[TODAY.getMonth()]} (Calendario)`);
  return m.length?`Para tenerlo todo al día me falta:\n${m.map(x=>'• '+x).join('\n')}\nSin prisa, vamos poco a poco.`:'Lo tengo todo. ¡Buen trabajo!'}
function aiCore(q){
  const it=NLP.intent(q,TODAY,new Date().getHours()),out=(text,op)=>{const m={who:'ai',text};if(op){m.op=op}return m};
  if(it.kind==='hello')return out(pick([`¡Hola! ${welcomeLine().split('. ').slice(1).join('. ')}`,`¡Buenas! ¿Qué apuntamos hoy?`]));
  if(it.kind==='thanks')return out(pick(['¡A ti! Aquí estoy para lo que necesites.','De nada. Si surge algo más, me lo dices y lo apunto.','Perfecto. Seguimos.']));
  if(it.kind==='undo'){for(let i=S.chat.length-1;i>=0;i--){const m=S.chat[i];if(m.op&&!m.undone&&m.op.kind!=='photo'){undoOp(m);if(m.op.kind==='sale')return out(`Deshecho: ${m.op.prev?'he dejado la venta del '+dshort(parse(m.op.date))+' como estaba':'he quitado la venta del '+dshort(parse(m.op.date))}.`);return out(`Deshecho: ${m.op.kind==='add'?'he quitado':m.op.kind==='del'?'he recuperado':'he devuelto a su fecha'} «${m.op.ev.title}».`)}}return out('No tengo nada reciente que deshacer.')}
  if(it.kind==='sale'){const v=it.s,d=parse(v.date);
    if(d>TODAY)return out('Esa fecha aún no ha llegado. ¿De qué día es la venta?');
    const prev=putSale(v.date,{net:v.net,var:v.var,uds:v.uds,udsVar:v.udsVar,src:'ai'});
    const df=Math.round((TODAY-d)/864e5),cuando=df===0?'hoy':df===1?'ayer':`el ${dlong(d)}`;
    const big=isNum(v.var)&&Math.abs(v.var)>=PEAK;
    let t=pick([`Apuntado: ${cuando}, ${isNum(v.net)?fK(v.net):'sin importe'}${isNum(v.var)?' ('+fP(v.var)+' vs A-1)':''}.`,`Hecho. Venta de ${cuando}: ${isNum(v.net)?fK(v.net):'–'}${isNum(v.var)?', '+fP(v.var)+' vs A-1':''}.`]);
    if(big)t+=v.var>0?' ¡Vaya pico! Lo marco en la semana.':' Bajada fuerte; la dejo marcada en la semana para revisarla.';
    else if(isNum(v.var))t+=v.var>=0?' Buen día.':'';
    if(v.defaulted)t+=` (No me dijiste el día; lo he puesto en ${cuando}. Si no es, dime «era el lunes».)`;
    if(prev)t+=' Sustituye a lo que tenía apuntado.';
    if(!isNum(v.var))t+=' Si me dices el % vs A-1, lo completo.';
    const m=out(t,{kind:'sale',date:v.date,prev,now:{...S.sales[v.date]}});m.toast='Venta guardada';return m}
  if(it.kind==='saleq'){const x=it.x;let a,b;if(x&&x.date&&x.end){a=x.date;b=x.end}else if(x&&x.date){a=b=x.date}else{a=iso(monday(TODAY));b=iso(TODAY)}
    const L=Object.keys(S.sales||{}).filter(k=>k>=a&&k<=b).sort();
    if(!L.length)return out(a===b?`No tengo la venta del ${dlong(parse(a))}. ¿Me la dices? Por ejemplo: «vendimos 20.500, +3%».`:'Aún no tengo ventas apuntadas en esas fechas. Dímelas o mándame la captura.');
    return out(L.length===1?`El ${saleTxt(L[0])}.`:`Esto tengo:\n${L.map(k=>'• '+saleTxt(k)).join('\n')}`)}
  if(it.kind==='delete'&&/\bventa|vendimos\b/.test(NLP.norm(it.rest))){const x=NLP.extract(it.rest,TODAY);let dt=x.date;if(dt&&dt>iso(TODAY)){const d=parse(dt);d.setDate(d.getDate()-7);dt=iso(d)}
    if(!dt||!saleOf(dt))return out('No encuentro esa venta. ¿De qué día era?');
    const prev={...saleOf(dt)};delete S.sales[dt];const m=out(`Borrada la venta del ${dlong(parse(dt))}.`,{kind:'sale',date:dt,prev,now:null});m.toast='Venta borrada';return m}
  if(it.kind==='add'){
    const x=it.x;let title=it.title;
    const dup=S.events.find(e=>e.date===x.date&&NLP.norm(e.title)===NLP.norm(title));
    if(dup)return out(`Eso ya lo tenía apuntado ${whenTxt(dup)}. Lo dejo como está.`);
    const ev={id:Date.now()+Math.floor(Math.random()*1000),date:x.date,end:x.end&&x.end!==x.date?x.end:null,time:x.time||null,timeEnd:x.timeEnd||null,title,type:it.type};
    S.events.push(ev);
    const t=lowFirst(title);
    const txt=ev.end?(x.week?pick([`Hecho. Bloqueo la semana del ${parse(ev.date).getDate()} al ${dshort(parse(ev.end))} para ${t}.`,`Genial, ${t} toda la semana: del lunes ${parse(ev.date).getDate()} al domingo ${dshort(parse(ev.end))}.`]):pick([`Apuntado: ${t} ${whenTxt(ev)} (${evDays(ev)} días).`,`Perfecto, ${t} ${whenTxt(ev)}.`]))
      :pick([`¡Apuntado! ${cap(t)} ${whenTxt(ev)}.`,`Hecho, ${t} queda ${whenTxt(ev)}.`,`Perfecto. Te dejo ${t} ${whenTxt(ev)}.`]);
    const m=out(txt+hintFor(ev),{kind:'add',ev:{...ev}});m.toast='Apuntado en el calendario';return m}
  if(it.kind==='list'){const x=it.x;let a,b,label;
    if(x.date&&x.end){a=x.date;b=x.end;label=x.week?(x.date===iso(monday(TODAY))?'esta semana':x.date===iso(addDays(monday(TODAY),7))?'la semana que viene':`la semana del ${dshort(parse(a))}`):x.scope==='month'?`en ${MON[parse(a).getMonth()]}`:`del ${dshort(parse(a))} al ${dshort(parse(b))}`}
    else if(x.date){a=b=x.date;const d=parse(a),df=Math.round((d-TODAY)/864e5);label=df===0?'hoy':df===1?'mañana':`el ${dlong(d)}`}
    else{a=iso(monday(TODAY));b=iso(addDays(monday(TODAY),6));label='esta semana'}
    return out(listTxt(a,b,label))}
  if(it.kind==='missing')return out(missingTxt());
  if(it.kind==='delete'){const r=NLP.matchEvents(S.events,it.rest,TODAY);
    if(!r.list.length)return out(pick(['No encuentro ningún evento así. ¿Me dices el día o el nombre exacto?','Mmm, no lo veo en el calendario. ¿Qué día era?']));
    if(r.list.length>1)return out(`Tengo ${r.list.length} que encajan:\n${r.list.slice(0,4).map(e=>`• ${dshort(parse(e.date))} — ${e.title}`).join('\n')}\n¿Cuál borro? Dímelo con el día.`);
    const e=r.list[0];S.events=S.events.filter(x=>x.id!==e.id);const m=out(pick([`Listo, he borrado ${lowFirst(e.title)} (${whenTxt(e)}).`,`Hecho: ${lowFirst(e.title)} fuera del calendario.`]),{kind:'del',ev:{...e}});m.toast='Evento eliminado';return m}
  if(it.kind==='move'){const r=NLP.matchEvents(S.events,it.src,TODAY);const dst=NLP.extract(it.dst||'',TODAY);
    if(!r.list.length)return out('No encuentro ese evento. ¿Me dices cómo se llama o qué día es?');
    if(r.list.length>1)return out(`Hay ${r.list.length} parecidos:\n${r.list.slice(0,4).map(e=>`• ${dshort(parse(e.date))} — ${e.title}`).join('\n')}\n¿Cuál muevo?`);
    if(!dst.date&&!dst.time)return out(`¿A qué día muevo ${lowFirst(r.list[0].title)}?`);
    const e=r.list[0],prev={date:e.date,end:e.end||null,time:e.time||null,timeEnd:e.timeEnd||null};
    if(dst.date){const len=evDays(e)-1;e.date=dst.date;e.end=dst.end&&dst.end!==dst.date?dst.end:(len?iso(addDays(parse(dst.date),len)):null)}
    if(dst.time){e.time=dst.time;e.timeEnd=dst.timeEnd||null}
    const m=out(pick([`Movido. ${cap(lowFirst(e.title))} pasa ${('a '+whenTxt(e)).replace(/^a el /,'al ')}.`,`Hecho, ${lowFirst(e.title)} ahora es ${whenTxt(e)}.`])+hintFor(e),{kind:'move',ev:{...e},prev});m.toast='Evento movido';return m}
  /* otras consultas */
  const l=NLP.norm(q);
  const who=S.people.find(p=>l.includes(NLP.norm(p.name.split(' ')[0]))||l.includes(p.id));
  if(who&&/(numero|empleado|n º|nº)/.test(l))return out(`${who.name} · Nº de empleado ${who.id}. ${who.role}, ${who.section}.`);
  if(/camion|mercancia|paqueteria/.test(l)){const days=(S.truckDays||[]).map(i=>DOW[i].toLowerCase());const C=merchCalc();
    return out(days.length?`El camión llega los ${days.join(', ')} y el turno es de ${S.shiftStart} a ${S.shiftEnd}.${C.pack?` Para el próximo tengo ${fmt(C.truck)} uds (${fmt(C.pack)} de paquetería${C.hang?` + ${fmt(C.hang)} de confección`:''}): necesitas ${C.need} personas sobre la paquetería.`:' Cuando tengas las unidades de paquetería, ponlas en Mercancía y te calculo el equipo.'}`:`Aún no sé qué días llega el camión. Márcalos en Mercancía y lo pongo en tu semana (turno ${S.shiftStart}–${S.shiftEnd}).`)}
  if(/gap|venta|negocio|como vamos|como va/.test(l)){if(!S.report)return out('Todavía no tengo el análisis de la semana. Mándame la captura (botón de la cámara) y, mientras activamos la lectura automática, me puedes dictar la venta: «ayer vendimos 20.500, +3%».');
    const t=lecturaTienda(S.report).replace(/<[^>]+>/g,'').replace(/\s*(auto|editada)\s*$/,'');return out(t||'Tengo el análisis, pero le faltan la venta y la zona para hacer la lectura.')}
  if(/pendien|tarea|que tengo que hacer/.test(l)){const r=aiRequests(),t=S.tasks.filter(t=>!t.done);
    return out(`${r.length?`Necesito de ti:\n${r.map(x=>'• '+x.title).join('\n')}`:'No necesito nada de ti ahora mismo.'}${t.length?`\n\nTareas abiertas:\n${t.slice(0,6).map(x=>'• '+x.text).join('\n')}`:''}`)}
  if(it.x&&it.x.date&&!it.title)return out(`¿Qué hay ${whenTxt({date:it.x.date,end:it.x.end,time:it.x.time})}? Dímelo y lo apunto.`);
  return out(pick(['No te he entendido del todo. Prueba con algo como «el día 27 tenemos formación con el equipo», «mueve la reunión al viernes» o «¿qué tengo esta semana?».','Perdona, no lo he pillado. Puedo apuntar, mover o borrar cosas del calendario, guardar la venta del día («ayer vendimos 20.500, +3%») y decirte qué tienes cualquier día.']));
}
function undoOp(m){const o=m.op;if(o.kind==='sale'){if(o.prev)S.sales[o.date]={...o.prev};else delete S.sales[o.date];m.undone=true;return}if(o.kind==='add')S.events=S.events.filter(e=>e.id!==o.ev.id);else if(o.kind==='del')S.events.push({...o.ev});else if(o.kind==='move'){const e=S.events.find(x=>x.id===o.ev.id);if(e)Object.assign(e,o.prev)}m.undone=true}
function aiUndo(i){const m=S.chat[i];if(!m||!m.op||m.undone)return;undoOp(m);save();render();toast('Deshecho')}

/* ===================== SHELL / NAVEGACIÓN ===================== */
const TABS=[['inicio','home','Inicio'],['negocio','chart','Negocio'],['ai','spark','STORE AI'],['personas','users','Personas'],['mercancia','truck','Mercancía'],['calendario','cal','Calendario']];
const SIDE=[['inicio','home','Inicio'],['negocio','chart','Negocio'],['ai','spark','STORE AI'],['personas','users','Personas'],['mercancia','truck','Mercancía'],['calendario','cal','Calendario']];
function pageHead(t,sub){return `<div class="ph"><div><div class="eyebrow">ZARA</div><div class="h1">${t}</div><div class="lead">${sub}</div></div><div class="right"><span class="pill line">${ic('clock','sm')} ${dshort(TODAY)}</span></div></div>`}
function nav(){
  const badge=aiRequests().length;
  $('sidenav').innerHTML=SIDE.map(([id,i,l])=>`<button class="navbtn ${S.page===id?'active':''}" onclick="goto('${id}')">${ic(i)}${l}${id==='ai'&&badge?`<span class="badge pill ${S.page===id?'':'amb'}" style="height:19px">${badge}</span>`:''}</button>`).join('');
  $('tabbar').innerHTML=TABS.map(([id,i,l])=>id==='ai'?`<button class="tb-ai ${S.page===id?'active':''}" onclick="goto('ai')"><span class="aib">${ic(i)}</span>${l}${badge?`<span class="badge">${badge}</span>`:''}</button>`:`<button class="${S.page===id?'active':''}" onclick="goto('${id}')">${ic(i)}${l}</button>`).join('');
}
function goto(p){FLASH=null;if(p==='gestion')p=(S.manage==='mercancia')?'mercancia':'personas';S.page=p;save();render();window.scrollTo(0,0)}
function goMerch(){goto('mercancia')}
function goTasks(){S.page='personas';save();render();setTimeout(()=>$('seguimiento')?.scrollIntoView({behavior:'smooth',block:'start'}),40)}
function goPerson(i,tab='ficha'){S.page='personas';S.person=i;S.personTab=tab;S.personEdit=false;save();render();if(innerWidth<900)setTimeout(()=>$('ficha')?.scrollIntoView({behavior:'smooth',block:'start'}),40);else window.scrollTo(0,0)}
function resetData(){if(confirm('¿Restablecer los datos y cambios guardados en este dispositivo?')){localStorage.removeItem(KEY);try{Object.keys(localStorage).filter(k=>k.indexOf(IMG_PREFIX)===0).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}}
function render(){
  nav();
  if(S.page==='gestion')S.page=(S.manage==='mercancia')?'mercancia':'personas';
  const pages={inicio:home,negocio:negocio,personas:pagePersonas,mercancia:pageMercancia,calendario:calendario,ai:ai};
  $('app').innerHTML=(pages[S.page]||home)()+`<div class="footer-note"><span class="fn-brand"><svg class="zwm" viewBox="${ZVB}"><path d="${ZPATH}"/></svg><span>STORE MANAGER · v1.0</span></span><button class="btn sm ghost" onclick="resetData()">${ic('refresh','sm')} Restablecer datos</button></div>`;
  if(S.page==='ai')scrollChat();
}
if(!S.chat.length)S.chat=[{who:'ai',text:welcomeLine()}];
render();


</script>
